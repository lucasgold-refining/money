<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emz">
<title>Emz Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--navy:#14213d;--gold:#f5c442;--bg:#f4f6fa;--card:#fff;--text:#1d2433;--muted:#667085;--red:#c62828;--redbg:#fdecea;--green:#1b7f3b;--greenbg:#e8f5e9;--line:#e3e7ef;--amber:#b54708;--amberbg:#fff4e5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px;font-weight:700}
header h1 span{color:var(--gold)}
main{padding:14px 14px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:13px;color:var(--muted);min-height:64px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:22px;line-height:1}
nav button.on{color:var(--navy);font-weight:700}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{margin:0 0 8px;font-size:18px}
.lbl{font-size:14px;color:var(--muted);font-weight:600}
.big{font-size:32px;font-weight:800;letter-spacing:-.5px}
.mid{font-size:22px;font-weight:800}
.hero{text-align:center;border-left:5px solid var(--gold)}
.hero .big{font-size:38px}
.acct{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;background:var(--card);border-radius:14px;padding:16px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);font-size:17px;color:var(--text);text-align:left;min-height:64px}
.acct b{font-size:20px;white-space:nowrap}
.acct .chev{color:var(--muted);font-size:20px}
.neg{color:var(--red)}
.muted{color:var(--muted);font-size:14px}
.red{color:var(--red);font-weight:700}
.warn{background:var(--amberbg);color:var(--amber);border-radius:12px;padding:12px 14px;font-weight:600;margin-bottom:12px;font-size:15px;border:0;width:100%;text-align:left;display:block}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px;color:#344054}
input,select,textarea{width:100%;font-size:17px;padding:12px;border:1px solid #cdd3df;border-radius:10px;background:#fff;min-height:50px;color:var(--text);font-family:inherit}
textarea{min-height:140px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.amt{font-size:26px;font-weight:800}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700;min-height:56px;margin-top:14px;background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.light{background:#e8ecf4;color:var(--navy)}
.btn.danger{background:var(--redbg);color:var(--red)}
.btn.green{background:var(--green);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .btn{margin-top:10px}
.seg{display:flex;background:#e8ecf4;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;border-radius:9px;padding:10px 4px;font-size:15px;font-weight:700;background:none;color:var(--muted);min-height:50px}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg button.on.in{color:var(--green)}.seg button.on.out{color:var(--red)}.seg button.on.transfer{color:#3538cd}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid #cdd3df;background:#fff;border-radius:12px;min-height:50px;padding:8px 14px;font-size:16px;font-weight:700;color:var(--text)}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff}
.item{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .body{flex:1;min-width:0}
.item .body .t{font-weight:600}
.item .amtc{font-weight:800;white-space:nowrap;text-align:right}
.item .acts{display:flex;gap:6px}
.item .acts button{border:0;background:#e8ecf4;border-radius:10px;min-width:44px;min-height:44px;font-size:17px}
.item .acts button.del{background:var(--redbg)}
.plus{color:var(--green)}.minus{color:var(--red)}.xfer{color:#3538cd}
.loan{width:100%;border:0;background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);text-align:left;color:var(--text);font-size:15px;display:block}
.loan.overdue{border-left:5px solid var(--red)}
.loan.paid{border-left:5px solid var(--green);opacity:.85}
.loan.open{border-left:5px solid var(--navy)}
.loan .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.loan .who{font-size:18px;font-weight:700}
.loan .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.loan .nums div{background:var(--bg);border-radius:8px;padding:6px 8px}
.loan .nums small{display:block;color:var(--muted);font-size:12px}
.loan .nums b{font-size:15px}
.badge{font-size:13px;padding:4px 10px;border-radius:99px;font-weight:800;white-space:nowrap}
.badge.Open{background:#e8ecf4;color:var(--navy)}
.badge.Overdue{background:var(--redbg);color:var(--red)}
.badge.Paid{background:var(--greenbg);color:var(--green)}
.setacct{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.setacct .r{display:grid;grid-template-columns:1fr 120px 48px;gap:6px;align-items:end}
.setacct label{margin-top:0;font-size:12px}
.iconbtn{border:0;background:var(--redbg);color:var(--red);border-radius:10px;min-height:50px;font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#111;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:90%;text-align:center}
.toast.show{opacity:.92}
.empty{text-align:center;color:var(--muted);padding:20px 10px}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(10,16,30,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal h2{margin:0;font-size:20px}
.modal .x{border:0;background:#e8ecf4;border-radius:10px;min-width:44px;min-height:44px;font-size:18px}
.sumgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.sumgrid div{background:var(--bg);border-radius:10px;padding:8px}
.sumgrid small{display:block;color:var(--muted);font-size:12px}
.sumgrid b{font-size:16px}
label .dh{font-weight:500;color:var(--muted)}
h3{font-size:15px;margin:18px 0 4px;color:#344054}
</style>
</head>
<body>
<header><h1>₱ Emz <span>Tracker</span></h1></header>
<main id="app"></main>
<nav>
  <button data-v="home" class="on"><span class="ic">🏠</span>Home</button>
  <button data-v="add"><span class="ic">➕</span>Add</button>
  <button data-v="loans"><span class="ic">🤝</span>Loans</button>
  <button data-v="set"><span class="ic">⚙️</span>Settings</button>
</nav>
<div class="toast" id="toast"></div>
<script>
'use strict';
const APP_V = 1;
const KEY = 'emz-money-v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function defaultState() {
  return {
    version: 1,
    accounts: [
      { id: 'main', name: 'BPI Main', opening: 0 },
      { id: 'timmy', name: 'BPI Timmy', opening: 0 },
      { id: 'ethan', name: 'BPI Ethan', opening: 0 }
    ],
    tx: [],          // {id,type:'in'|'out'|'transfer',amount,account,to,date,note,created}
    loans: [],       // {id,borrower,amount,account,date,due,note,created}
    repayments: [],  // {id,loanId,amount,account,date,note,created}
    lastBackup: null
  };
}
function valid(d) { return d && Array.isArray(d.accounts) && Array.isArray(d.tx) && Array.isArray(d.loans) && Array.isArray(d.repayments); }
let S;
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!valid(S)) { S = defaultState(); save(); }
}
function save() { localStorage.setItem(KEY, JSON.stringify(S)); }
load();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cents = n => Math.round((Number(n) || 0) * 100);
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const peso = n => (cents(n) < 0 ? '−₱' : '₱') + (Math.abs(cents(n)) / 100).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const fmtDate = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };
const acct = id => S.accounts.find(a => a.id === id);
const acctName = id => { const a = acct(id); return a ? a.name : '(deleted account)'; };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400); }
const byNewest = (a, b) => (b.date || '').localeCompare(a.date || '') || (b.created || 0) - (a.created || 0);
function parseAmt(v) { const n = Number(String(v).replace(/[₱,\s]/g, '')); return isFinite(n) ? r2(n) : NaN; }

// ---------- calculations (in cents to avoid rounding drift) ----------
function balanceC(id) {
  const a = acct(id); let c = a ? cents(a.opening) : 0;
  for (const t of S.tx) {
    if (t.type === 'in' && t.account === id) c += cents(t.amount);
    if (t.type === 'out' && t.account === id) c -= cents(t.amount);
    if (t.type === 'transfer') { if (t.account === id) c -= cents(t.amount); if (t.to === id) c += cents(t.amount); }
  }
  for (const l of S.loans) if (l.account === id) c -= cents(l.amount);
  for (const r of S.repayments) if (r.account === id) c += cents(r.amount);
  return c;
}
const balance = id => balanceC(id) / 100;
const totalBalance = () => S.accounts.reduce((s, a) => s + balanceC(a.id), 0) / 100;
const repaysOf = id => S.repayments.filter(r => r.loanId === id);
function loanInfo(l) {
  const repaidC = repaysOf(l.id).reduce((s, r) => s + cents(r.amount), 0);
  const outC = Math.max(0, cents(l.amount) - repaidC);
  const status = outC === 0 ? 'Paid' : (l.due && l.due < todayISO() ? 'Overdue' : 'Open');
  return { lent: cents(l.amount) / 100, repaid: repaidC / 100, out: outC / 100, status };
}
function loanTotals() {
  let outC = 0, open = 0, overdue = 0;
  for (const l of S.loans) { const i = loanInfo(l); outC += cents(i.out); if (i.status !== 'Paid') open++; if (i.status === 'Overdue') overdue++; }
  return { out: outC / 100, open, overdue };
}
function daysSinceBackup() { return S.lastBackup ? Math.floor((Date.now() - S.lastBackup) / 86400000) : null; }
const hasData = () => S.tx.length || S.loans.length || S.repayments.length || S.accounts.some(a => cents(a.opening));

// ---------- navigation ----------
let view = 'home';
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.v));
function go(v, opts) {
  view = v; addMode = (opts && opts.mode) || addMode;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  render(); window.scrollTo(0, 0);
}
function render() {
  const app = $('#app');
  if (view === 'home') app.innerHTML = homeHTML();
  else if (view === 'add') { app.innerHTML = '<div class="card" id="addCard"></div>'; txForm($('#addCard'), null); }
  else if (view === 'loans') app.innerHTML = loansHTML();
  else if (view === 'set') { app.innerHTML = setHTML(); bindSettings(); }
}

// ---------- home ----------
function homeHTML() {
  const lt = loanTotals(), tb = totalBalance(), ds = daysSinceBackup();
  let h = '';
  if (hasData() && (ds === null || ds >= 7))
    h += `<button class="warn" id="backupNag" onclick="go('set')">💾 ${ds === null ? 'You haven’t backed up yet.' : `Last backup was ${ds} days ago.`} Tap to back up.</button>`;
  h += `<div class="card hero"><div class="lbl">Total balance</div><div class="big ${tb < 0 ? 'neg' : ''}" id="totalBal">${peso(tb)}</div></div>`;
  for (const a of S.accounts) {
    const b = balance(a.id);
    h += `<button class="acct" data-acct="${esc(a.id)}" onclick="openAccount('${esc(a.id)}')"><span>${esc(a.name)}</span><span><b class="${b < 0 ? 'neg' : ''}">${peso(b)}</b> <span class="chev">›</span></span></button>`;
  }
  h += `<button class="acct" id="owedCard" onclick="go('loans')" style="flex-direction:column;align-items:stretch">
    <span class="lbl">Owed to me</span><span class="mid" id="owedTotal">${peso(lt.out)}</span>
    <span class="muted" id="owedMeta">${lt.open} open loan${lt.open === 1 ? '' : 's'}${lt.overdue ? ` · <span class="red">${lt.overdue} overdue</span>` : ''}</span></button>`;
  h += `<div class="card"><div class="lbl">Net worth <span class="muted">(balance + owed)</span></div><div class="mid" id="netWorth">${peso(tb + lt.out)}</div></div>`;
  h += `<div class="row2"><button class="btn" onclick="go('add')">➕ Add money</button><button class="btn gold" onclick="lendForm()">🤝 Lend money</button></div>`;
  return h;
}

// ---------- modal ----------
function openModal(html) {
  closeModal();
  const m = document.createElement('div'); m.className = 'modal'; m.id = 'modal';
  m.innerHTML = `<div class="sheet">${html}</div>`;
  m.addEventListener('click', e => { if (e.target === m) closeModal(); });
  document.body.appendChild(m); document.body.style.overflow = 'hidden';
  return m.firstElementChild;
}
function closeModal() { const m = $('#modal'); if (m) m.remove(); document.body.style.overflow = ''; }
const mhead = t => `<div class="mh"><h2>${t}</h2><button class="x" onclick="closeModal()" aria-label="Close">✕</button></div>`;
function chipsHTML(id, sel, exclude) {
  return `<div class="chips" id="${id}">` + S.accounts.filter(a => a.id !== exclude).map(a => `<button type="button" class="chip ${a.id === sel ? 'on' : ''}" data-id="${esc(a.id)}">${esc(a.name)}</button>`).join('') + '</div>';
}
function bindChips(root, id, onPick) {
  root.querySelectorAll(`#${id} .chip`).forEach(c => c.onclick = () => {
    root.querySelectorAll(`#${id} .chip`).forEach(x => x.classList.remove('on')); c.classList.add('on'); onPick && onPick(c.dataset.id);
  });
}
const chipVal = (root, id) => { const c = root.querySelector(`#${id} .chip.on`); return c ? c.dataset.id : null; };

// ---------- transaction form (Add screen + edit) ----------
let addMode = 'in', addAcct = null; // addAcct: account pre-picked when opening Add from an account
function txForm(root, tx, defAcct) {
  let mode = tx ? tx.type : addMode;
  const first = S.accounts[0] ? S.accounts[0].id : null;
  let from = tx ? tx.account : (defAcct || (acct(addAcct) ? addAcct : first)); if (!tx) addAcct = null;
  let to = tx ? tx.to : (S.accounts.find(a => a.id !== from) || {}).id;
  const draw = () => {
    const amt = root.querySelector('#amt') ? root.querySelector('#amt').value : (tx ? tx.amount : '');
    const date = root.querySelector('#date') ? root.querySelector('#date').value : (tx ? tx.date : todayISO());
    const note = root.querySelector('#note') ? root.querySelector('#note').value : (tx ? tx.note || '' : '');
    if (mode === 'transfer' && (!to || to === from)) to = (S.accounts.find(a => a.id !== from) || {}).id;
    root.innerHTML = (tx ? mhead('Edit entry') : '<h2>Add money</h2>') + `
      <div class="seg" id="modeSeg">
        <button type="button" class="in ${mode === 'in' ? 'on' : ''}" data-m="in">＋ Money in</button>
        <button type="button" class="out ${mode === 'out' ? 'on' : ''}" data-m="out">− Money out</button>
        <button type="button" class="transfer ${mode === 'transfer' ? 'on' : ''}" data-m="transfer">⇄ Transfer</button>
      </div>
      <label for="amt">Amount (₱)</label>
      <input id="amt" class="amt" inputmode="decimal" placeholder="0.00" value="${esc(amt)}" autocomplete="off">
      <label>${mode === 'transfer' ? 'From account' : 'Account'}</label>${chipsHTML('fromChips', from)}
      ${mode === 'transfer' ? `<label>To account</label>${chipsHTML('toChips', to, from)}` : ''}
      <label for="date">Date</label><input id="date" type="date" value="${esc(date)}">
      <label for="note">Note (optional)</label><input id="note" value="${esc(note)}" placeholder="${mode === 'in' ? 'e.g. salary' : mode === 'out' ? 'e.g. groceries' : ''}">
      <button class="btn ${mode === 'in' ? 'green' : ''}" id="saveTx">${tx ? 'Save changes' : mode === 'in' ? 'Save money in' : mode === 'out' ? 'Save money out' : 'Save transfer'}</button>
      ${tx ? '<button class="btn danger" id="delTx">Delete entry</button>' : ''}`;
    root.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => { mode = b.dataset.m; if (!tx) addMode = mode; draw(); });
    bindChips(root, 'fromChips', id => { from = id; if (mode === 'transfer') draw(); });
    bindChips(root, 'toChips', id => { to = id; });
    root.querySelector('#saveTx').onclick = () => {
      const amount = parseAmt(root.querySelector('#amt').value);
      if (!(amount > 0)) { toast('Enter an amount above ₱0'); return; }
      if (!from || !acct(from)) { toast('Pick an account'); return; }
      if (mode === 'transfer' && (!to || to === from || !acct(to))) { toast('Pick a different “to” account'); return; }
      const d = root.querySelector('#date').value || todayISO();
      const rec = { type: mode, amount, account: from, to: mode === 'transfer' ? to : null, date: d, note: root.querySelector('#note').value.trim() };
      if (tx) { Object.assign(tx, rec); save(); closeModal(); refreshAfterEdit(); toast('Saved'); }
      else {
        S.tx.push(Object.assign({ id: uid(), created: Date.now() }, rec)); save();
        toast(mode === 'transfer' ? `Moved ${peso(amount)} to ${acctName(to)}` : `${mode === 'in' ? 'Added' : 'Spent'} ${peso(amount)} · ${acctName(from)} now ${peso(balance(from))}`);
        go('home');
      }
    };
    const del = root.querySelector('#delTx');
    if (del) del.onclick = () => { if (!confirm('Delete this entry?')) return; S.tx = S.tx.filter(x => x !== tx); save(); closeModal(); refreshAfterEdit(); toast('Deleted'); };
  };
  draw();
}
let reopen = null; // re-open the account / loan sheet after editing inside it
function refreshAfterEdit() { render(); if (reopen) { const f = reopen; reopen = null; f(); } }
function editTx(id) { const t = S.tx.find(x => x.id === id); if (!t) return; const back = reopen; const sh = openModal(''); txForm(sh, t); reopen = back; }
function delTx(id) { if (!confirm('Delete this entry?')) return; S.tx = S.tx.filter(x => x.id !== id); save(); refreshAfterEdit(); toast('Deleted'); }

// ---------- account detail ----------
function openAccount(id) {
  const a = acct(id); if (!a) return;
  const rows = [];
  for (const t of S.tx) {
    if (t.type === 'in' && t.account === id) rows.push({ d: t, sign: 1, t: 'Money in', kind: 'tx' });
    if (t.type === 'out' && t.account === id) rows.push({ d: t, sign: -1, t: 'Money out', kind: 'tx' });
    if (t.type === 'transfer' && t.account === id) rows.push({ d: t, sign: -1, t: 'Transfer to ' + acctName(t.to), kind: 'tx', x: 1 });
    if (t.type === 'transfer' && t.to === id) rows.push({ d: t, sign: 1, t: 'Transfer from ' + acctName(t.account), kind: 'tx', x: 1 });
  }
  for (const l of S.loans) if (l.account === id) rows.push({ d: l, sign: -1, t: 'Lent to ' + l.borrower, kind: 'loan', loan: l.id });
  for (const r of S.repayments) if (r.account === id) { const l = S.loans.find(x => x.id === r.loanId); rows.push({ d: r, sign: 1, t: 'Repaid by ' + (l ? l.borrower : '?'), kind: 'loan', loan: r.loanId }); }
  rows.sort((p, q) => byNewest(p.d, q.d));
  const b = balance(id);
  let h = mhead(esc(a.name)) + `<div class="lbl" style="margin-top:8px">Balance</div><div class="big ${b < 0 ? 'neg' : ''}">${peso(b)}</div>
    <div class="row2"><button class="btn" onclick="closeModal();addMode='in';addAcct='${esc(id)}';go('add');">➕ Add</button><button class="btn light" onclick="closeModal();go('set')">✏️ Edit account</button></div>
    <h3>Recent</h3><div id="acctRows">`;
  if (!rows.length) h += `<div class="empty">No entries yet${cents(a.opening) ? ` · opening balance ${peso(a.opening)}` : ''}</div>`;
  for (const r of rows) {
    const cls = r.x ? 'xfer' : r.sign > 0 ? 'plus' : 'minus';
    h += `<div class="item"><div class="body"><div class="t">${esc(r.t)}</div><div class="muted">${fmtDate(r.d.date)}${r.d.note ? ' · ' + esc(r.d.note) : ''}</div></div>
      <div class="amtc ${cls}">${r.sign > 0 ? '+' : '−'}${peso(r.d.amount)}</div>
      <div class="acts">${r.kind === 'tx' ? `<button onclick="reopen=()=>openAccount('${esc(id)}');editTx('${r.d.id}')" aria-label="Edit">✏️</button><button class="del" onclick="reopen=()=>openAccount('${esc(id)}');delTx('${r.d.id}')" aria-label="Delete">🗑️</button>`
        : `<button onclick="openLoan('${r.loan}')" aria-label="Open loan">›</button>`}</div></div>`;
  }
  if (cents(a.opening) && rows.length) h += `<div class="item"><div class="body"><div class="t">Opening balance</div></div><div class="amtc">${peso(a.opening)}</div></div>`;
  h += '</div>';
  openModal(h);
}

// ---------- loans ----------
function loansHTML() {
  const lt = loanTotals();
  let h = `<div class="card hero"><div class="lbl">Owed to me</div><div class="big" id="loansOwed">${peso(lt.out)}</div>
    <div class="muted">${lt.open} open${lt.overdue ? ` · <span class="red">${lt.overdue} overdue</span>` : ''}</div></div>
    <button class="btn gold" id="lendBtn" onclick="lendForm()" style="margin:0 0 14px">🤝 Lend money</button>`;
  if (!S.loans.length) return h + '<div class="empty">No loans yet.</div>';
  const order = { Overdue: 0, Open: 1, Paid: 2 };
  const list = S.loans.map(l => ({ l, i: loanInfo(l) })).sort((a, b) => order[a.i.status] - order[b.i.status] || byNewest(a.l, b.l));
  let paidHdr = false;
  for (const { l, i } of list) {
    if (i.status === 'Paid' && !paidHdr) { h += '<h3>Paid</h3>'; paidHdr = true; }
    h += `<button class="loan ${i.status.toLowerCase()}" data-loan="${l.id}" onclick="openLoan('${l.id}')">
      <div class="top"><span class="who">${esc(l.borrower)}</span><span class="badge ${i.status}">${i.status}</span></div>
      <div class="muted">${fmtDate(l.date)}${l.due ? ' · due ' + fmtDate(l.due) : ''}</div>
      <div class="nums"><div><small>Lent</small><b>${peso(i.lent)}</b></div><div><small>Repaid</small><b>${peso(i.repaid)}</b></div><div><small>Outstanding</small><b class="${i.status === 'Overdue' ? 'neg' : ''}">${peso(i.out)}</b></div></div></button>`;
  }
  return h;
}
function lendForm(id) {
  const l = id ? S.loans.find(x => x.id === id) : null;
  const names = [...new Set(S.loans.map(x => x.borrower))].sort();
  const sh = openModal(mhead(l ? 'Edit loan' : 'Lend money') + `
    <label for="lBor">Borrower</label><input id="lBor" list="borList" value="${esc(l ? l.borrower : '')}" placeholder="Name" autocomplete="off">
    <datalist id="borList">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <label for="lAmt">Amount (₱)</label><input id="lAmt" class="amt" inputmode="decimal" placeholder="0.00" value="${l ? esc(l.amount) : ''}">
    <label>From account</label>${chipsHTML('lAcct', l ? l.account : (S.accounts[0] || {}).id)}
    <div class="row2"><div><label for="lDate">Date</label><input id="lDate" type="date" value="${esc(l ? l.date : todayISO())}"></div>
    <div><label for="lDue">Due (optional)</label><input id="lDue" type="date" value="${esc(l ? l.due || '' : '')}"></div></div>
    <label for="lNote">Note (optional)</label><input id="lNote" value="${esc(l ? l.note || '' : '')}">
    <button class="btn gold" id="saveLoan">${l ? 'Save changes' : 'Save loan'}</button>
    ${l ? '<button class="btn light" id="cancelLoan">Cancel</button>' : ''}`);
  bindChips(sh, 'lAcct');
  if (l) sh.querySelector('#cancelLoan').onclick = () => openLoan(l.id);
  sh.querySelector('#saveLoan').onclick = () => {
    const borrower = sh.querySelector('#lBor').value.trim(), amount = parseAmt(sh.querySelector('#lAmt').value), account = chipVal(sh, 'lAcct');
    if (!borrower) { toast('Enter the borrower’s name'); return; }
    if (!(amount > 0)) { toast('Enter an amount above ₱0'); return; }
    if (!account) { toast('Pick an account'); return; }
    if (l && cents(amount) < cents(loanInfo(l).repaid)) { toast(`Already repaid ${peso(loanInfo(l).repaid)} — amount can’t be less`); return; }
    const rec = { borrower, amount, account, date: sh.querySelector('#lDate').value || todayISO(), due: sh.querySelector('#lDue').value || null, note: sh.querySelector('#lNote').value.trim() };
    if (l) { Object.assign(l, rec); save(); render(); openLoan(l.id); toast('Saved'); }
    else { S.loans.push(Object.assign({ id: uid(), created: Date.now() }, rec)); save(); closeModal(); go('loans'); toast(`Lent ${peso(amount)} to ${borrower}`); }
  };
}
function openLoan(id) {
  const l = S.loans.find(x => x.id === id); if (!l) { closeModal(); return; }
  const i = loanInfo(l), reps = repaysOf(id).sort(byNewest);
  let h = mhead(esc(l.borrower)) + `<div style="margin-top:6px"><span class="badge ${i.status}" id="loanStatus">${i.status}</span></div>
    <div class="sumgrid"><div><small>Lent</small><b>${peso(i.lent)}</b></div><div><small>Repaid</small><b>${peso(i.repaid)}</b></div><div><small>Outstanding</small><b id="loanOut" class="${i.status === 'Overdue' ? 'neg' : ''}">${peso(i.out)}</b></div></div>
    <div class="muted" style="margin-top:8px">From ${esc(acctName(l.account))} · ${fmtDate(l.date)}${l.due ? ' · due ' + fmtDate(l.due) : ''}${l.note ? '<br>' + esc(l.note) : ''}</div>
    ${i.status !== 'Paid' ? '<button class="btn green" id="repayBtn">💵 Record repayment</button>' : ''}
    <h3>Repayments</h3>`;
  if (!reps.length) h += '<div class="empty">None yet</div>';
  for (const r of reps) h += `<div class="item"><div class="body"><div class="t">Into ${esc(acctName(r.account))}</div><div class="muted">${fmtDate(r.date)}${r.note ? ' · ' + esc(r.note) : ''}</div></div>
    <div class="amtc plus">+${peso(r.amount)}</div><div class="acts"><button onclick="repayForm('${id}','${r.id}')" aria-label="Edit">✏️</button><button class="del" onclick="delRepay('${r.id}')" aria-label="Delete">🗑️</button></div></div>`;
  h += `<div class="row2"><button class="btn light" id="editLoan">✏️ Edit loan</button><button class="btn danger" id="delLoan">🗑️ Delete loan</button></div>`;
  const sh = openModal(h);
  const rb = sh.querySelector('#repayBtn'); if (rb) rb.onclick = () => repayForm(id);
  sh.querySelector('#editLoan').onclick = () => lendForm(id);
  sh.querySelector('#delLoan').onclick = () => {
    if (!confirm(`Delete this loan to ${l.borrower}${reps.length ? ` and its ${reps.length} repayment${reps.length > 1 ? 's' : ''}` : ''}?`)) return;
    S.loans = S.loans.filter(x => x.id !== id); S.repayments = S.repayments.filter(r => r.loanId !== id); save(); closeModal(); render(); toast('Loan deleted');
  };
}
function repayForm(loanId, repId) {
  const l = S.loans.find(x => x.id === loanId); if (!l) return;
  const r = repId ? S.repayments.find(x => x.id === repId) : null;
  const maxC = cents(loanInfo(l).out) + (r ? cents(r.amount) : 0);
  const sh = openModal(mhead(r ? 'Edit repayment' : 'Record repayment') + `<div class="muted">${esc(l.borrower)} · outstanding ${peso(maxC / 100)}</div>
    <label for="rAmt">Amount (₱)</label><input id="rAmt" class="amt" inputmode="decimal" placeholder="0.00" value="${r ? esc(r.amount) : ''}">
    ${r ? '' : `<button type="button" class="chip" id="rFull" style="margin-top:8px">Full amount ${peso(maxC / 100)}</button>`}
    <label>Into account</label>${chipsHTML('rAcct', r ? r.account : (acct(l.account) ? l.account : (S.accounts[0] || {}).id))}
    <label for="rDate">Date</label><input id="rDate" type="date" value="${esc(r ? r.date : todayISO())}">
    <label for="rNote">Note (optional)</label><input id="rNote" value="${esc(r ? r.note || '' : '')}">
    <button class="btn green" id="saveRepay">${r ? 'Save changes' : 'Save repayment'}</button>
    <button class="btn light" id="cancelRepay">Cancel</button>`);
  bindChips(sh, 'rAcct');
  const full = sh.querySelector('#rFull'); if (full) full.onclick = () => { sh.querySelector('#rAmt').value = (maxC / 100).toFixed(2); };
  sh.querySelector('#cancelRepay').onclick = () => openLoan(loanId);
  sh.querySelector('#saveRepay').onclick = () => {
    const amount = parseAmt(sh.querySelector('#rAmt').value), account = chipVal(sh, 'rAcct');
    if (!(amount > 0)) { toast('Enter an amount above ₱0'); return; }
    if (cents(amount) > maxC) { toast(`That’s more than the ${peso(maxC / 100)} outstanding`); return; }
    if (!account) { toast('Pick an account'); return; }
    const rec = { amount, account, date: sh.querySelector('#rDate').value || todayISO(), note: sh.querySelector('#rNote').value.trim() };
    if (r) Object.assign(r, rec); else S.repayments.push(Object.assign({ id: uid(), loanId, created: Date.now() }, rec));
    save(); render(); openLoan(loanId);
    toast(loanInfo(l).status === 'Paid' ? `${l.borrower}’s loan is fully paid 🎉` : `Repayment saved · ${peso(loanInfo(l).out)} left`);
  };
}
function delRepay(id) {
  const r = S.repayments.find(x => x.id === id); if (!r || !confirm(`Delete this ${peso(r.amount)} repayment?`)) return;
  S.repayments = S.repayments.filter(x => x !== r); save(); render(); openLoan(r.loanId); toast('Deleted');
}

// ---------- settings: accounts + backup ----------
function setHTML() {
  const ds = daysSinceBackup();
  let h = '<div class="card"><h2>Accounts</h2><div id="acctList">';
  for (const a of S.accounts) h += `<div class="setacct" data-id="${esc(a.id)}"><div class="r">
      <div><label>Name</label><input class="aname" value="${esc(a.name)}"></div>
      <div><label>Opening ₱</label><input class="aopen" inputmode="decimal" value="${(cents(a.opening) / 100).toFixed(2)}"></div>
      <button class="iconbtn adel" aria-label="Delete account">🗑️</button></div></div>`;
  h += `</div><button class="btn light" id="addAcct">＋ Add account</button></div>
    <div class="card"><h2>Backup</h2><div class="muted" id="lastBackup">${S.lastBackup ? `Last backup: ${fmtDate(new Date(S.lastBackup - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10))} (${ds === 0 ? 'today' : ds + ' day' + (ds === 1 ? '' : 's') + ' ago'})` : 'No backup yet'}</div>
    <div class="muted" style="margin-top:4px">Your data stays only on this phone. Copy or share a backup to yourself (e.g. Messenger, Notes, email) now and then.</div>
    <div class="row2"><button class="btn" id="copyBk">📋 Copy backup</button><button class="btn" id="shareBk">📤 Share backup</button></div>
    <button class="btn light" id="restoreBk">♻️ Restore from backup</button>
    <button class="btn light" id="copyCsv">📄 Copy as CSV (spreadsheet)</button></div>
    <div class="muted" style="text-align:center">Emz Tracker v${APP_V}</div>`;
  return h;
}
function bindSettings() {
  document.querySelectorAll('.setacct').forEach(row => {
    const a = acct(row.dataset.id);
    row.querySelector('.aname').onchange = e => { const v = e.target.value.trim(); if (!v) { e.target.value = a.name; toast('Name can’t be empty'); return; } a.name = v; save(); toast('Renamed'); };
    row.querySelector('.aopen').onchange = e => { const v = parseAmt(e.target.value || 0); if (isNaN(v)) { e.target.value = (cents(a.opening) / 100).toFixed(2); toast('Not a valid amount'); return; } a.opening = v; e.target.value = v.toFixed(2); save(); toast('Opening balance saved'); };
    row.querySelector('.adel').onclick = () => {
      const used = S.tx.filter(t => t.account === a.id || t.to === a.id).length + S.loans.filter(l => l.account === a.id).length + S.repayments.filter(r => r.account === a.id).length;
      if (S.accounts.length <= 1) { toast('You need at least one account'); return; }
      if (used) { toast(`${a.name} has ${used} entr${used === 1 ? 'y' : 'ies'} — delete or move them first`); return; }
      if (!confirm(`Delete account “${a.name}”?`)) return;
      S.accounts = S.accounts.filter(x => x !== a); save(); render(); toast('Account deleted');
    };
  });
  $('#addAcct').onclick = () => {
    const name = (prompt('New account name', 'BPI ') || '').trim(); if (!name) return;
    S.accounts.push({ id: uid(), name, opening: 0 }); save(); render(); toast('Account added');
  };
  $('#copyBk').onclick = async () => { if (await copyText(backupText())) { markBackup(); toast('Backup copied — paste it somewhere safe'); } };
  $('#shareBk').onclick = async () => {
    const text = backupText();
    if (navigator.share) {
      try { await navigator.share({ title: 'Emz Tracker backup ' + fmtDate(todayISO()), text }); markBackup(); toast('Backup shared'); }
      catch (e) { if (e && e.name !== 'AbortError') { if (await copyText(text)) { markBackup(); toast('Couldn’t share — copied instead'); } } }
    } else if (await copyText(text)) { markBackup(); toast('Sharing not available — backup copied instead'); }
  };
  $('#restoreBk').onclick = restoreForm;
  $('#copyCsv').onclick = async () => { if (await copyText(csvText())) toast('CSV copied — paste into a spreadsheet'); };
}
function markBackup() { S.lastBackup = Date.now(); save(); if (view === 'set') render(); }
function backupText() { return JSON.stringify({ app: 'emz-tracker', exported: new Date().toISOString(), data: S }); }
async function copyText(text) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  if (!ok) { // last resort: show the text so it can be copied by hand
    const sh = openModal(mhead('Copy this text') + '<div class="muted">Press and hold, Select all, then Copy.</div><textarea id="manualCopy" readonly></textarea>');
    sh.querySelector('#manualCopy').value = text;
  }
  return ok;
}
function parseBackup(txt) {
  let d; try { d = JSON.parse(String(txt).trim()); } catch (e) { return null; }
  if (d && d.data) d = d.data;
  return valid(d) ? d : null;
}
function restoreForm() {
  const sh = openModal(mhead('Restore backup') + `<div class="muted">Paste the backup text you copied or shared earlier. This replaces everything currently in the app.</div>
    <textarea id="restoreTxt" placeholder='{"app":"emz-tracker",...}'></textarea>
    <button class="btn" id="doRestore">Restore</button><button class="btn light" onclick="closeModal()">Cancel</button>`);
  sh.querySelector('#doRestore').onclick = () => {
    const d = parseBackup(sh.querySelector('#restoreTxt').value);
    if (!d) { toast('That doesn’t look like an Emz Tracker backup'); return; }
    if (!confirm(`Replace all current data with this backup?\n${d.accounts.length} accounts · ${d.tx.length} transactions · ${d.loans.length} loans · ${d.repayments.length} repayments`)) return;
    S = Object.assign(defaultState(), d); S.lastBackup = Date.now(); save(); closeModal(); go('home'); toast('Backup restored');
  };
}
function csvText() {
  const q = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = [['Date', 'Type', 'Account', 'To account', 'Amount', 'Borrower', 'Due', 'Note']];
  for (const a of S.accounts) rows.push(['', 'Opening balance', a.name, '', r2(a.opening).toFixed(2), '', '', '']);
  const all = [];
  for (const t of S.tx) all.push([t.date, t.type === 'in' ? 'Money in' : t.type === 'out' ? 'Money out' : 'Transfer', acctName(t.account), t.type === 'transfer' ? acctName(t.to) : '', r2(t.amount).toFixed(2), '', '', t.note || '']);
  for (const l of S.loans) all.push([l.date, 'Loan given', acctName(l.account), '', r2(l.amount).toFixed(2), l.borrower, l.due ? fmtDate(l.due) : '', l.note || '']);
  for (const r of S.repayments) { const l = S.loans.find(x => x.id === r.loanId); all.push([r.date, 'Repayment', acctName(r.account), '', r2(r.amount).toFixed(2), l ? l.borrower : '', '', r.note || '']); }
  all.sort((a, b) => a[0].localeCompare(b[0])).forEach(r => { r[0] = fmtDate(r[0]); rows.push(r); });
  return rows.map(r => r.map(q).join(',')).join('\n');
}

// Show every date as dd/mm/yyyy next to its label (the phone's date box follows the phone's own format).
function hintDates() {
  document.querySelectorAll('input[type=date]').forEach(i => {
    const l = document.querySelector(`label[for="${i.id}"]`); if (!l) return;
    let s = l.querySelector('.dh'); if (!s) { s = document.createElement('span'); s.className = 'dh'; l.appendChild(s); }
    const t = i.value ? ' · ' + fmtDate(i.value) : ''; if (s.textContent !== t) s.textContent = t;
  });
}
document.addEventListener('input', e => { if (e.target.type === 'date') hintDates(); });
document.addEventListener('change', e => { if (e.target.type === 'date') hintDates(); });
new MutationObserver(hintDates).observe(document.body, { childList: true, subtree: true });
render();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
