<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emz">
<title>Emz Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--navy:#14213d;--gold:#f5c442;--bg:#f4f6fa;--card:#fff;--text:#1d2433;--muted:#667085;--red:#c62828;--redbg:#fdecea;--green:#1b7f3b;--greenbg:#e8f5e9;--line:#e3e7ef;--amber:#b54708;--amberbg:#fff4e5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:62px}
header h1{margin:0;font-size:20px;font-weight:700}
header h1 span{color:var(--gold)}
main{padding:14px 14px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;min-width:0;border:0;background:none;padding:10px 2px 12px;font-size:12px;white-space:nowrap;color:var(--muted);min-height:64px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:22px;line-height:1}
nav button.on{color:var(--navy);font-weight:700}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{margin:0 0 8px;font-size:18px}
.lbl{font-size:14px;color:var(--muted);font-weight:600}
.big{font-size:32px;font-weight:800;letter-spacing:-.5px}
.mid{font-size:22px;font-weight:800}
.hero{text-align:center;border-left:5px solid var(--gold)}
.hero .big{font-size:38px}
.acct{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;background:var(--card);border-radius:14px;padding:16px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);font-size:17px;color:var(--text);text-align:left;min-height:64px}
.acct b{font-size:20px;white-space:nowrap}
.acctbox{background:var(--card);border-radius:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden}
.acctbox > .acct{background:none;box-shadow:none;margin:0;border-radius:0;cursor:pointer}
.acct .chev{flex:none;width:40px;min-height:46px;border:0;background:none;color:var(--muted);font-size:22px;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:transform .15s}
.acct .chev[aria-expanded=true]{transform:rotate(180deg);color:var(--navy)}
.accpanel{border-top:1px solid var(--line);padding:4px 14px 12px}
.accpanel .item{padding:10px 0}
.accpanel .pbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.accpanel .pbtns .btn{margin:0;min-height:50px;padding:8px 4px;font-size:15px}
.neg{color:var(--red)}
.muted{color:var(--muted);font-size:14px}
.warn{background:var(--amberbg);color:var(--amber);border-radius:12px;padding:12px 14px;font-weight:600;margin-bottom:12px;font-size:15px;border:0;width:100%;text-align:left;display:block}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px;color:#344054}
input,select,textarea{width:100%;font-size:17px;padding:12px;border:1px solid #cdd3df;border-radius:10px;background:#fff;min-height:50px;color:var(--text);font-family:inherit}
textarea{min-height:140px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.amt{font-size:26px;font-weight:800}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700;min-height:56px;margin-top:14px;background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.light{background:#e8ecf4;color:var(--navy)}
.btn.danger{background:var(--redbg);color:var(--red)}
.btn.green{background:var(--green);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .btn{margin-top:10px}
.seg{display:flex;background:#e8ecf4;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;border-radius:9px;padding:10px 4px;font-size:15px;font-weight:700;background:none;color:var(--muted);min-height:50px}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg button.on.in{color:var(--green)}.seg button.on.out{color:var(--red)}.seg button.on.transfer{color:#3538cd}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid #cdd3df;background:#fff;border-radius:12px;min-height:50px;padding:8px 14px;font-size:16px;font-weight:700;color:var(--text)}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff}
.item{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .body{flex:1;min-width:0}
.item .body .t{font-weight:600}
.item .amtc{font-weight:800;white-space:nowrap;text-align:right}
.item .acts{display:flex;gap:6px}
.item .acts button{border:0;background:#e8ecf4;border-radius:10px;min-width:44px;min-height:44px;font-size:17px}
.item .acts button.del{background:var(--redbg)}
.plus{color:var(--green)}.minus{color:var(--red)}.xfer{color:#3538cd}
.loan{width:100%;border:0;background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);text-align:left;color:var(--text);font-size:15px;display:block}
.loan.paid{border-left:5px solid var(--green);opacity:.85}
.loan.open{border-left:5px solid var(--navy)}
.loan .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.loan .who{font-size:18px;font-weight:700}
.loan .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.loan .nums div{background:var(--bg);border-radius:8px;padding:6px 8px}
.loan .nums small{display:block;color:var(--muted);font-size:12px}
.loan .nums b{font-size:15px}
.badge{font-size:13px;padding:4px 10px;border-radius:99px;font-weight:800;white-space:nowrap}
.badge.Open{background:#e8ecf4;color:var(--navy)}
.badge.Paid{background:var(--greenbg);color:var(--green)}
.setacct{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.setacct .r{display:grid;grid-template-columns:1fr 120px 48px;gap:6px;align-items:end}
.setacct label{margin-top:0;font-size:12px}
.iconbtn{border:0;background:var(--redbg);color:var(--red);border-radius:10px;min-height:50px;font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#111;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:90%;text-align:center}
.toast.show{opacity:.92}
.empty{text-align:center;color:var(--muted);padding:20px 10px}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(10,16,30,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal h2{margin:0;font-size:20px}
.modal .x{border:0;background:#e8ecf4;border-radius:10px;min-width:44px;min-height:44px;font-size:18px}
.sumgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.sumgrid div{background:var(--bg);border-radius:10px;padding:8px}
.sumgrid small{display:block;color:var(--muted);font-size:12px}
.sumgrid b{font-size:16px}
label .dh{font-weight:500;color:var(--muted)}
.eye{border:0;background:#e8ecf4;color:var(--navy);border-radius:12px;min-width:46px;min-height:46px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0 10px;flex:none;vertical-align:middle}
.eye svg{width:24px;height:24px}
.eye[aria-pressed=true]{background:var(--navy);color:var(--gold)}
header .eye{background:rgba(255,255,255,.12);color:#fff}
header .eye[aria-pressed=true]{background:var(--gold);color:var(--navy)}
.pv.masked{letter-spacing:1px;color:var(--muted)!important}
.eyecard{display:flex;align-items:center;gap:10px}
.eyecard .grow{flex:1;min-width:0}
.hero .eyecard .grow{text-align:center}
.fit{white-space:nowrap;overflow:hidden}
.acct .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .amtwrap{display:flex;align-items:center;gap:8px;flex:none}
.dcard .big{font-size:34px}
.chip.none{border-style:dashed;font-weight:600}
h3{font-size:15px;margin:18px 0 4px;color:#344054}
</style>
</head>
<body>
<header><h1>₱ Emz <span>Tracker</span></h1><span id="eyeAllWrap"></span></header>
<main id="app"></main>
<nav>
  <button data-v="home" class="on"><span class="ic">🏠</span>Home</button>
  <button data-v="add"><span class="ic">➕</span>Add</button>
  <button data-v="dash"><span class="ic">📊</span>Dashboard</button>
  <button data-v="loans"><span class="ic">🤝</span>Loans</button>
  <button data-v="set"><span class="ic">⚙️</span>Settings</button>
</nav>
<div class="toast" id="toast"></div>
<script>
'use strict';
const APP_V = 5;
const KEY = 'emz-money-v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function defaultState() {
  return {
    version: 1,
    accounts: [
      { id: 'main', name: 'BPI Main', type: 'bank', opening: 0 },
      { id: 'timmy', name: 'BPI Timmy', type: 'bank', opening: 0 },
      { id: 'ethan', name: 'BPI Ethan', type: 'bank', opening: 0 },
      { id: 'cash', name: 'Cash on hand', type: 'cash', opening: 0 } // v2: new installs only; existing data is never changed
    ],
    tx: [],          // {id,type:'in'|'out'|'transfer',amount,account,to,date,note,created}
    loans: [],       // {id,borrower,amount,account|null,date,note,created,more:[{id,amount,account|null,date,note,created}]} — account null = not from an account; 'more' = later tranches (v4); old 'due'/'dueDate' kept but ignored
    repayments: [],  // {id,loanId,amount,account|null,date,note,created} — account null = not into an account (v4)
    lastBackup: null
  };
}
function valid(d) { return d && Array.isArray(d.accounts) && Array.isArray(d.tx) && Array.isArray(d.loans) && Array.isArray(d.repayments); }
let S;
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!valid(S)) { S = defaultState(); save(); }
}
function save() { localStorage.setItem(KEY, JSON.stringify(S)); }
load();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cents = n => Math.round((Number(n) || 0) * 100);
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const peso = n => (cents(n) < 0 ? '−₱' : '₱') + (Math.abs(cents(n)) / 100).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const fmtDate = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };
const acct = id => S.accounts.find(a => a.id === id);
const acctName = id => { if (id == null || id === '') return 'No account'; const a = acct(id); return a ? a.name : '(deleted account)'; };
const NONE = '__none'; // chip value for "None" in loan / repayment forms
// A loan's tranches: the original amount first, then any 'Add more' tranches (v4). Old data without 'more' still works.
const tranches = l => [{ id: null, first: true, amount: l.amount, account: l.account == null ? null : l.account, date: l.date, note: l.note, created: l.created }, ...(Array.isArray(l.more) ? l.more : [])];
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400); }
// ---------- hide amounts (same eye pattern as the gold tracker; remembered on this phone) ----------
// Kept in its own key so it never touches the money data or backups. Keys: total, owed, net, a:<accountId>.
const PKEY = 'emz-money-privacy-v1';
let P; try { P = JSON.parse(localStorage.getItem(PKEY)); } catch (e) { P = null; }
if (!P || typeof P.h !== 'object' || !P.h) P = { h: {} };
const savePriv = () => localStorage.setItem(PKEY, JSON.stringify(P));
const MASK = '₱ ••••••';
const EYE_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
const privKeys = () => ['total', ...S.accounts.map(a => 'a:' + a.id), 'owed', 'net', 'd:bank', 'd:lent', 'd:cash', 'd:exp'];
const hid = k => !!P.h[k];
const allHidden = () => privKeys().every(hid);
// An amount: shows ₱ •••••• when its card is hidden (cls = extra classes when shown, e.g. 'neg').
const amt = (n, k, cls) => hid(k) ? `<span class="pv masked">${MASK}</span>` : `<span class="pv ${cls || ''}">${peso(n)}</span>`;
const amtT = (n, k) => hid(k) ? MASK : peso(n); // plain text version (toasts)
const eyeBtn = (k, label) => { const shown = !hid(k);
  return `<button type="button" class="eye" data-eye="${esc(k)}" aria-pressed="${shown}" aria-label="${shown ? 'Hide' : 'Show'} ${esc(label)}" title="${shown ? 'Hide' : 'Show'} ${esc(label)}" onclick="toggleEye(event,'${esc(k)}')">${shown ? EYE_OFF : EYE_OPEN}</button>`; };
function toggleEye(e, k) { if (e) { e.preventDefault(); e.stopPropagation(); } P.h[k] = !hid(k); savePriv(); render(); }
function toggleAll(e) { if (e) { e.preventDefault(); e.stopPropagation(); } const hide = !allHidden(); for (const k of privKeys()) P.h[k] = hide; savePriv(); render(); toast(hide ? 'All amounts hidden' : 'All amounts shown'); }
function drawEyeAll() { const shown = !allHidden(), l = shown ? 'Hide all amounts' : 'Show all amounts';
  $('#eyeAllWrap').innerHTML = `<button type="button" class="eye" id="eyeAll" aria-pressed="${shown}" aria-label="${l}" title="${l}" onclick="toggleAll(event)">${shown ? EYE_OFF : EYE_OPEN}</button>`; }
const byNewest = (a, b) => (b.date || '').localeCompare(a.date || '') || (b.created || 0) - (a.created || 0);
function parseAmt(v) { const n = Number(String(v).replace(/[₱,\s]/g, '')); return isFinite(n) ? r2(n) : NaN; }

// ---------- calculations (in cents to avoid rounding drift) ----------
function balanceC(id) {
  const a = acct(id); let c = a ? cents(a.opening) : 0;
  for (const t of S.tx) {
    if (t.type === 'in' && t.account === id) c += cents(t.amount);
    if (t.type === 'out' && t.account === id) c -= cents(t.amount);
    if (t.type === 'transfer') { if (t.account === id) c -= cents(t.amount); if (t.to === id) c += cents(t.amount); }
  }
  for (const l of S.loans) for (const t of tranches(l)) if (t.account != null && t.account === id) c -= cents(t.amount);
  for (const r of S.repayments) if (r.account != null && r.account === id) c += cents(r.amount);
  return c;
}
const balance = id => balanceC(id) / 100;
const totalBalance = () => S.accounts.reduce((s, a) => s + balanceC(a.id), 0) / 100;
const repaysOf = id => S.repayments.filter(r => r.loanId === id);
function loanInfo(l) {
  const lentC = tranches(l).reduce((x, t) => x + cents(t.amount), 0);
  const repaidC = repaysOf(l.id).reduce((x, r) => x + cents(r.amount), 0);
  const outC = Math.max(0, lentC - repaidC);
  const status = outC === 0 ? 'Paid' : 'Open'; // no overdue tracking
  return { lent: lentC / 100, repaid: repaidC / 100, out: outC / 100, status };
}
function loanTotals() {
  let outC = 0, open = 0;
  for (const l of S.loans) { const i = loanInfo(l); outC += cents(i.out); if (i.status !== 'Paid') open++; }
  return { out: outC / 100, open };
}
function daysSinceBackup() { return S.lastBackup ? Math.floor((Date.now() - S.lastBackup) / 86400000) : null; }
const hasData = () => S.tx.length || S.loans.length || S.repayments.length || S.accounts.some(a => cents(a.opening));

// ---------- navigation ----------
let view = 'home';
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.v));
function go(v, opts) {
  view = v; addMode = (opts && opts.mode) || addMode;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  render(); window.scrollTo(0, 0);
}
function render() { renderInner(); fitBig(); }
// Shrink big numbers so long amounts (e.g. ₱12,345,678.90) never run under the eye button.
function fitBig() {
  document.querySelectorAll('#app .hero .big, #app .dcard .big, #modal .big').forEach(el => {
    el.classList.add('fit'); el.style.fontSize = '';
    let f = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth + 1 && f > 20) { f -= 1; el.style.fontSize = f + 'px'; }
  });
}
function renderInner() {
  const app = $('#app'); drawEyeAll();
  if (view === 'home') app.innerHTML = homeHTML();
  else if (view === 'add') { app.innerHTML = '<div class="card" id="addCard"></div>'; txForm($('#addCard'), null); }
  else if (view === 'dash') app.innerHTML = dashHTML();
  else if (view === 'loans') app.innerHTML = loansHTML();
  else if (view === 'set') { app.innerHTML = setHTML(); bindSettings(); }
}

// ---------- home ----------
function homeHTML() {
  const lt = loanTotals(), tb = totalBalance(), ds = daysSinceBackup();
  let h = '';
  if (hasData() && (ds === null || ds >= 7))
    h += `<button class="warn" id="backupNag" onclick="go('set')">💾 ${ds === null ? 'You haven’t backed up yet.' : `Last backup was ${ds} days ago.`} Tap to back up.</button>`;
  // v5 order: Net worth (hero) · Total balance · accounts · Owed to me
  h += `<div class="card hero" id="netCard"><div class="eyecard"><div class="grow"><div class="lbl">Net worth <span class="muted">(balance + owed)</span></div><div class="big" id="netWorth">${amt(tb + lt.out, 'net', tb + lt.out < 0 ? 'neg' : '')}</div></div>${eyeBtn('net', 'net worth')}</div></div>`;
  h += `<div class="card" id="totalCard"><div class="eyecard"><div class="grow"><div class="lbl">Total balance</div><div class="mid" id="totalBal">${amt(tb, 'total', tb < 0 ? 'neg' : '')}</div></div>${eyeBtn('total', 'total balance')}</div></div>`;
  for (const a of S.accounts) {
    const b = balance(a.id);
    const op = openAccts.has(a.id);
    h += `<div class="acctbox${op ? ' open' : ''}" data-box="${esc(a.id)}"><div class="acct" role="button" tabindex="0" data-acct="${esc(a.id)}" aria-expanded="${op}" onclick="toggleAcct('${esc(a.id)}')"><span class="nm">${esc(a.name)}</span><span class="amtwrap"><b>${amt(b, 'a:' + a.id, b < 0 ? 'neg' : '')}</b><span class="chev" aria-expanded="${op}" aria-label="${op ? 'Collapse' : 'Expand'} ${esc(a.name)}">▾</span>${eyeBtn('a:' + a.id, a.name)}</span></div>${op ? acctPanel(a.id) : ''}</div>`;
  }
  h += `<div class="acct" role="button" tabindex="0" id="owedCard" onclick="go('loans')"><span class="grow" style="flex:1;min-width:0;display:flex;flex-direction:column">
    <span class="lbl">Owed to me</span><span class="mid" id="owedTotal">${amt(lt.out, 'owed')}</span>
    <span class="muted" id="owedMeta">${lt.open} open loan${lt.open === 1 ? '' : 's'}</span></span>${eyeBtn('owed', 'owed to me')}</div>`;
  h += `<div class="row2"><button class="btn" onclick="go('add')">➕ Add money</button><button class="btn gold" onclick="lendForm()">🤝 Lend money</button></div>`;
  return h;
}

// ---------- modal ----------
function openModal(html) {
  closeModal();
  const m = document.createElement('div'); m.className = 'modal'; m.id = 'modal';

// ---------- transaction form (Add screen + edit) ----------

function acctRows(id) {

  }

  for (const r of S.repayments) if (r.account === id) { const l = S.loans.find(x => x.id === r.loanId); rows.push({ d: r, sign: 1, t: 'Repaid by ' + (l ? l.borrower : '?'), kind: 'loan', loan: r.loanId }); }

}

    <label for="rAmt">Amount (₱)</label><input id="rAmt" class="amt" inputmode="decimal" placeholder="0.00" value="${r ? esc(r.amount) : ''}">
    ${r ? '' : `<button type="button" class="chip" id="rFull" style="margin-top:8px">Full amount${hid('owed') ? '' : ' ' + peso(maxC / 100)}</button>`}
    <label>Into account</label>${chipsHTML('rAcct', r ? selOf(r.account) : (l.account != null && acct(l.account) ? l.account : (S.accounts[0] || {}).id), null, 'None (not into an account)')}
    <label for="rDate">Date</label><input id="rDate" type="date" value="${esc(r ? r.date : todayISO())}">
    <label for="rNote">Note (optional)</label><input id="rNote" value="${esc(r ? r.note || '' : '')}">
    <button class="btn green" id="saveRepay">${r ? 'Save changes' : 'Save repayment'}</button>
    <button class="btn light" id="cancelRepay">Cancel</button>`);
  bindChips(sh, 'rAcct');
  const full = sh.querySelector('#rFull'); if (full) full.onclick = () => { sh.querySelector('#rAmt').value = (maxC / 100).toFixed(2); };
  sh.querySelector('#cancelRepay').onclick = () => openLoan(loanId);
  sh.querySelector('#saveRepay').onclick = () => {
    const amount = parseAmt(sh.querySelector('#rAmt').value), account = chipAcct(sh, 'rAcct');
    if (!(amount > 0)) { toast('Enter an amount above ₱0'); return; }
    if (cents(amount) > maxC) { toast(`That’s more than the ${amtT(maxC / 100, 'owed')} outstanding`); return; }
    if (account === undefined) { toast('Pick an account or None'); return; }
    const rec = { amount, account, date: sh.querySelector('#rDate').value || todayISO(), note: sh.querySelector('#rNote').value.trim() };
    if (r) Object.assign(r, rec); else S.repayments.push(Object.assign({ id: uid(), loanId, created: Date.now() }, rec));
    save(); render(); openLoan(loanId);
    toast(loanInfo(l).status === 'Paid' ? `${l.borrower}’s loan is fully paid 🎉` : `Repayment saved · ${amtT(loanInfo(l).out, 'owed')} left`);
  };
}
function delRepay(id) {
  const r = S.repayments.find(x => x.id === id); if (!r || !confirm(`Delete this ${amtT(r.amount, 'owed')} repayment?`)) return;
  S.repayments = S.repayments.filter(x => x !== r); save(); render(); openLoan(r.loanId); toast('Deleted');
}

// ---------- settings: accounts + backup ----------
function setHTML() {
  const ds = daysSinceBackup();
  let h = '<div class="card"><h2>Accounts</h2><div id="acctList">';
  for (const a of S.accounts) h += `<div class="setacct" data-id="${esc(a.id)}"><div class="r">
      <div><label>Name</label><input class="aname" value="${esc(a.name)}"></div>
      <div><label>Opening ₱</label><input class="aopen" ${hid('a:' + a.id) ? 'type="password" ' : ''}inputmode="decimal" value="${(cents(a.opening) / 100).toFixed(2)}"></div>
      <button class="iconbtn adel" aria-label="Delete account">🗑️</button></div></div>`;
  h += `</div><button class="btn light" id="addAcct">＋ Add account</button></div>
    <div class="card"><h2>Backup</h2><div class="muted" id="lastBackup">${S.lastBackup ? `Last backup: ${fmtDate(new Date(S.lastBackup - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10))} (${ds === 0 ? 'today' : ds + ' day' + (ds === 1 ? '' : 's') + ' ago'})` : 'No backup yet'}</div>
    <div class="muted" style="margin-top:4px">Your data stays only on this phone. Copy or share a backup to yourself (e.g. Messenger, Notes, email) now and then.</div>
    <div class="row2"><button class="btn" id="copyBk">📋 Copy backup</button><button class="btn" id="shareBk">📤 Share backup</button></div>
    <button class="btn light" id="restoreBk">♻️ Restore from backup</button>
    <button class="btn light" id="copyCsv">📄 Copy as CSV (spreadsheet)</button></div>
    <div class="muted" style="text-align:center">Emz Tracker v${APP_V}</div>`;
  return h;
}
function bindSettings() {
  document.querySelectorAll('.setacct').forEach(row => {
    const a = acct(row.dataset.id);
    row.querySelector('.aname').onchange = e => { const v = e.target.value.trim(); if (!v) { e.target.value = a.name; toast('Name can’t be empty'); return; } a.name = v; save(); toast('Renamed'); };
    row.querySelector('.aopen').onchange = e => { const v = parseAmt(e.target.value || 0); if (isNaN(v)) { e.target.value = (cents(a.opening) / 100).toFixed(2); toast('Not a valid amount'); return; } a.opening = v; e.target.value = v.toFixed(2); save(); toast('Opening balance saved'); };
    row.querySelector('.adel').onclick = () => {
      const used = S.tx.filter(t => t.account === a.id || t.to === a.id).length + S.loans.reduce((n, l) => n + tranches(l).filter(t => t.account === a.id).length, 0) + S.repayments.filter(r => r.account === a.id).length;
      if (S.accounts.length <= 1) { toast('You need at least one account'); return; }
      if (used) { toast(`${a.name} has ${used} entr${used === 1 ? 'y' : 'ies'} — delete or move them first`); return; }
      if (!confirm(`Delete account “${a.name}”?`)) return;
      S.accounts = S.accounts.filter(x => x !== a); save(); render(); toast('Account deleted');
    };
  });
  $('#addAcct').onclick = () => {
    const name = (prompt('New account name', 'BPI ') || '').trim(); if (!name) return;
    const nid = uid(), wasAll = allHidden(); S.accounts.push({ id: nid, name, type: /cash/i.test(name) ? 'cash' : 'bank', opening: 0 }); if (wasAll) { P.h['a:' + nid] = true; savePriv(); } save(); render(); toast('Account added');
  };
  $('#copyBk').onclick = async () => { if (await copyText(backupText())) { markBackup(); toast('Backup copied — paste it somewhere safe'); } };
  $('#shareBk').onclick = async () => {
    const text = backupText();
    if (navigator.share) {
      try { await navigator.share({ title: 'Emz Tracker backup ' + fmtDate(todayISO()), text }); markBackup(); toast('Backup shared'); }
      catch (e) { if (e && e.name !== 'AbortError') { if (await copyText(text)) { markBackup(); toast('Couldn’t share — copied instead'); } } }
    } else if (await copyText(text)) { markBackup(); toast('Sharing not available — backup copied instead'); }
  };
  $('#restoreBk').onclick = restoreForm;
  $('#copyCsv').onclick = async () => { if (await copyText(csvText())) toast('CSV copied — paste into a spreadsheet'); };
}
function markBackup() { S.lastBackup = Date.now(); save(); if (view === 'set') render(); }
function backupText() { return JSON.stringify({ app: 'emz-tracker', exported: new Date().toISOString(), data: S }); }
async function copyText(text) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  if (!ok) { // last resort: show the text so it can be copied by hand
    const sh = openModal(mhead('Copy this text') + '<div class="muted">Press and hold, Select all, then Copy.</div><textarea id="manualCopy" readonly></textarea>');
    sh.querySelector('#manualCopy').value = text;
  }
  return ok;
}
function parseBackup(txt) {
  let d; try { d = JSON.parse(String(txt).trim()); } catch (e) { return null; }
  if (d && d.data) d = d.data;
  return valid(d) ? d : null;
}
function restoreForm() {
  const sh = openModal(mhead('Restore backup') + `<div class="muted">Paste the backup text you copied or shared earlier. This replaces everything currently in the app.</div>
    <textarea id="restoreTxt" placeholder='{"app":"emz-tracker",...}'></textarea>
    <button class="btn" id="doRestore">Restore</button><button class="btn light" onclick="closeModal()">Cancel</button>`);
  sh.querySelector('#doRestore').onclick = () => {
    const d = parseBackup(sh.querySelector('#restoreTxt').value);
    if (!d) { toast('That doesn’t look like an Emz Tracker backup'); return; }
    if (!confirm(`Replace all current data with this backup?\n${d.accounts.length} accounts · ${d.tx.length} transactions · ${d.loans.length} loans · ${d.repayments.length} repayments`)) return;
    S = Object.assign(defaultState(), d); S.lastBackup = Date.now(); save(); closeModal(); go('home'); toast('Backup restored');
  };
}
function csvText() {
  const q = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = [['Date', 'Type', 'Account', 'To account', 'Amount', 'Borrower', 'Note']];
  for (const a of S.accounts) rows.push(['', 'Opening balance', a.name, '', r2(a.opening).toFixed(2), '', '']);
  const all = [];
  for (const t of S.tx) all.push([t.date, t.type === 'in' ? 'Money in' : t.type === 'out' ? 'Money out' : 'Transfer', acctName(t.account), t.type === 'transfer' ? acctName(t.to) : '', r2(t.amount).toFixed(2), '', t.note || '']);
  for (const l of S.loans) for (const t of tranches(l)) all.push([t.date, t.first ? 'Loan given' : 'Loan given (more)', acctName(t.account), '', r2(t.amount).toFixed(2), l.borrower, t.note || '']);
  for (const r of S.repayments) { const l = S.loans.find(x => x.id === r.loanId); all.push([r.date, 'Repayment', acctName(r.account), '', r2(r.amount).toFixed(2), l ? l.borrower : '', r.note || '']); }
  all.sort((a, b) => a[0].localeCompare(b[0])).forEach(r => { r[0] = fmtDate(r[0]); rows.push(r); });
  return rows.map(r => r.map(q).join(',')).join('\n');
}

// Show every date as dd/mm/yyyy next to its label (the phone's date box follows the phone's own format).
function hintDates() {
  document.querySelectorAll('input[type=date]').forEach(i => {
    const l = document.querySelector(`label[for="${i.id}"]`); if (!l) return;
    let s = l.querySelector('.dh'); if (!s) { s = document.createElement('span'); s.className = 'dh'; l.appendChild(s); }
    const t = i.value ? ' · ' + fmtDate(i.value) : ''; if (s.textContent !== t) s.textContent = t;
  });
}
document.addEventListener('input', e => { if (e.target.type === 'date') hintDates(); });
document.addEventListener('change', e => { if (e.target.type === 'date') hintDates(); });
new MutationObserver(hintDates).observe(document.body, { childList: true, subtree: true });
render();
window.addEventListener('resize', fitBig);
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
