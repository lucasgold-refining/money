<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B2A4E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<title>Ledger</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/manrope-400-800.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* v9 fonts (self-hosted, OFL — see fonts/OFL-*.txt): Manrope for the whole UI and every amount (has ₱, tabular figures);
   Playfair Display only for the word "Ledger" in the header (subset to those 5 letters, ~2 KB). */
@font-face{font-family:'Manrope';src:url('fonts/manrope-400-800.woff2') format('woff2');font-weight:400 800;font-style:normal;font-display:swap}
@font-face{font-family:'Ledger Title';src:url('fonts/playfair-title.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
/* v6 palette: plum + blush + rose gold (all text pairs checked for WCAG AA ≥ 4.5:1) */
:root{--plum:#5B2A4E;--rose:#D4A5A5;--rosedeep:#C9897B;--bg:#FFF5F7;--card:#fff;--text:#3A1F33;--muted:#7A5468;--red:#B3364A;--redbg:#FDECEF;--green:#1b7f3b;--greenbg:#e8f5e9;--line:#F1DDE4;--amber:#8C3A5A;--amberbg:#FBE3EC;--soft:#F8E6EC;--label:#4A2F42;--xfer:#6A3FA0;--input:#E3C6D1;--shadow:rgba(91,42,78,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:1rem/1.45 "Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-variant-numeric:lining-nums tabular-nums}
button,input,select,textarea{font-family:inherit}
.big,.mid,.amtc,.acct b,.trio b,.sumgrid b,.loan .nums b,.dline b{font-variant-numeric:lining-nums tabular-nums}
.btn.sm{display:inline-block;width:auto;min-height:44px;padding:8px 12px;margin:0;font-size:14px}
header{background:var(--plum);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:62px}
header h1{margin:0;font-size:20px;font-weight:700}
header h1{font-size:26px;font-weight:700;letter-spacing:.6px;display:flex;align-items:baseline;gap:8px}
header h1 .peso{color:var(--rose);font-family:'Manrope',sans-serif;font-weight:700;font-size:1.125rem}
main{padding:14px 14px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;min-width:0;border:0;background:none;padding:10px 2px 12px;font-size:12px;white-space:nowrap;color:var(--muted);min-height:64px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:22px;line-height:1}
nav button.on{color:var(--plum);font-weight:700}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px var(--shadow)}
.card h2{margin:0 0 8px;font-size:18px}
.lbl{font-size:14px;color:var(--muted);font-weight:600}
.big{font-size:32px;font-weight:800;letter-spacing:-.5px}
.mid{font-size:22px;font-weight:800}
.hero{text-align:center;border-left:5px solid var(--rosedeep)}
.hero .big{font-size:38px}
.acct{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;background:var(--card);border-radius:14px;padding:16px 14px;margin-bottom:10px;box-shadow:0 1px 3px var(--shadow);font-size:17px;color:var(--text);text-align:left;min-height:64px}
.acct b{font-size:20px;white-space:nowrap}
.acctbox{background:var(--card);border-radius:14px;margin-bottom:10px;box-shadow:0 1px 3px var(--shadow);overflow:hidden}
.acctbox > .acct{background:none;box-shadow:none;margin:0;border-radius:0;cursor:pointer}
.acct .chev{flex:none;width:40px;min-height:46px;border:0;background:none;color:var(--muted);font-size:22px;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:transform .15s}
.acct .chev[aria-expanded=true]{transform:rotate(180deg);color:var(--plum)}
.accpanel{border-top:1px solid var(--line);padding:4px 14px 12px}
.accpanel .item{padding:10px 0}
.accpanel .pbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.accpanel .pbtns .btn{margin:0;min-height:50px;padding:8px 4px;font-size:15px}
.neg{color:var(--red)}
.muted{color:var(--muted);font-size:14px}
.warn{background:var(--amberbg);color:var(--amber);border-radius:12px;padding:12px 14px;font-weight:600;margin-bottom:12px;font-size:15px;border:0;width:100%;text-align:left;display:block}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px;color:var(--label)}
input,select,textarea{width:100%;font-size:17px;padding:12px;border:1px solid var(--input);border-radius:10px;background:#fff;min-height:50px;color:var(--text);font-family:inherit}
textarea{min-height:140px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.amt{font-size:26px;font-weight:800}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700;min-height:56px;margin-top:14px;background:var(--plum);color:#fff}
.btn.gold{background:var(--rose);color:var(--plum)}
.btn.light{background:var(--soft);color:var(--plum)}
.btn.danger{background:var(--redbg);color:var(--red)}
.btn.green{background:var(--green);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .btn{margin-top:10px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;border-radius:9px;padding:10px 4px;font-size:15px;font-weight:700;background:none;color:var(--muted);min-height:50px}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(91,42,78,.14)}
.seg button.on.in{color:var(--green)}.seg button.on.out{color:var(--red)}.seg button.on.transfer{color:var(--xfer)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--input);background:#fff;border-radius:12px;min-height:50px;padding:8px 14px;font-size:16px;font-weight:700;color:var(--text)}
.chip.on{border-color:var(--plum);background:var(--plum);color:#fff}
.item{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .body{flex:1;min-width:0}
.item .body .t{font-weight:600}
.item .amtc{font-weight:800;white-space:nowrap;text-align:right}
.item .acts{display:flex;gap:6px}
.item .acts button{border:0;background:var(--soft);border-radius:10px;min-width:44px;min-height:44px;font-size:17px}
.item .acts button.del{background:var(--redbg)}
.plus{color:var(--green)}.minus{color:var(--red)}.xfer{color:var(--xfer)}
.loan{width:100%;border:0;background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px var(--shadow);text-align:left;color:var(--text);font-size:15px;display:block}
.loan.paid{border-left:5px solid var(--green);opacity:.85}
.loan.open{border-left:5px solid var(--plum)}
.loan .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.loan .who{font-size:18px;font-weight:700}
.loan .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.loan .nums div{background:var(--bg);border-radius:8px;padding:6px 8px}
.loan .nums small{display:block;color:var(--muted);font-size:12px}
.loan .nums b{font-size:15px}
.badge{font-size:13px;padding:4px 10px;border-radius:99px;font-weight:800;white-space:nowrap}
.badge.Open{background:var(--soft);color:var(--plum)}
.badge.Paid{background:var(--greenbg);color:var(--green)}
.setacct{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.setacct .r{display:grid;grid-template-columns:1fr 120px 48px;gap:6px;align-items:end}
.setacct label{margin-top:0;font-size:12px}
.iconbtn{border:0;background:var(--redbg);color:var(--red);border-radius:10px;min-height:50px;font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--text);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:90%;text-align:center}
.toast.show{opacity:.92}
/* v8 photos */
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.th{position:relative;width:60px;height:60px;border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--soft);flex:0 0 auto}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.blur img{filter:blur(9px);transform:scale(1.15)}
.th.blur::after{content:'🙈';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px}
.th .thx{position:absolute;top:2px;right:2px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(58,31,51,.8);color:#fff;font-size:13px;line-height:26px;padding:0}
.imgfield .thumbs:empty{display:none}
.addimg{display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:8px}
.imgnote{margin-top:4px}
.clip{white-space:nowrap}
.viewer{position:fixed;inset:0;background:#160a13;z-index:50;display:flex;flex-direction:column;color:#fff}
.viewer .vbar{display:flex;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;gap:8px}
.viewer .vbar button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:12px;min-width:48px;min-height:48px;font-size:20px;margin-left:6px}
.viewer .vstage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none}
.viewer .vstage img{max-width:100%;max-height:100%;object-fit:contain;-webkit-user-drag:none}
.viewer .vnav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.16);color:#fff;width:48px;height:64px;font-size:34px;border-radius:12px}
.viewer .vnav.prev{left:6px}.viewer .vnav.next{right:6px}
.viewer .vnav[hidden]{display:none}
.updToast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--plum);color:#fff;border:1px solid var(--rose);padding:10px 16px;border-radius:999px;font:700 .875rem 'Manrope',sans-serif;z-index:41;box-shadow:0 4px 14px rgba(58,31,51,.25);white-space:nowrap}
.updToast[hidden]{display:none}
.empty{text-align:center;color:var(--muted);padding:20px 10px}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(45,15,38,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal h2{margin:0;font-size:20px}
.modal .x{border:0;background:var(--soft);border-radius:10px;min-width:44px;min-height:44px;font-size:18px}
.sumgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.sumgrid div{background:var(--bg);border-radius:10px;padding:8px}
.sumgrid small{display:block;color:var(--muted);font-size:12px}
.sumgrid b{font-size:16px}
label .dh{font-weight:500;color:var(--muted)}
.eye{border:0;background:var(--soft);color:var(--plum);border-radius:12px;min-width:46px;min-height:46px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0 10px;flex:none;vertical-align:middle}
.eye svg{width:24px;height:24px}
.eye[aria-pressed=true]{background:var(--plum);color:var(--rose)}
header .eye{background:rgba(255,255,255,.12);color:#fff}
header .eye[aria-pressed=true]{background:var(--rose);color:var(--plum)}
.pv.masked{letter-spacing:1px;color:var(--muted)!important}
.eyecard{display:flex;align-items:center;gap:10px}
.eyecard .grow{flex:1;min-width:0}
.hero .eyecard .grow{text-align:center}
.fit{white-space:nowrap;overflow:hidden}
.acct .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .amtwrap{display:flex;align-items:center;gap:8px;flex:none}
.dcard .big{font-size:34px}
.chip.none{border-style:dashed;font-weight:600}
h3{font-size:15px;margin:18px 0 4px;color:var(--label)}

/* ===== v9 layout: compact, proportional cards tuned for Galaxy S25/S26 Ultra (412 CSS px) — 4/8 px spacing, rem type ===== */
:root{--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--r:14px;--rs:10px;--pad:12px;--ico:36px;--eye:40px;--sh:0 1px 2px rgba(91,42,78,.08),0 2px 8px rgba(91,42,78,.05)}
header{min-height:56px;padding:calc(env(safe-area-inset-top) + var(--s2)) var(--s3) var(--s2) var(--s4)}
header h1{font-family:'Ledger Title','Manrope',Georgia,serif;font-size:1.5rem;font-weight:700;letter-spacing:.4px;gap:6px}
main{padding:var(--s3) var(--s3) calc(88px + env(safe-area-inset-bottom))}
nav button{min-height:58px;padding:8px 2px 10px;font-size:.6875rem;gap:3px}
nav button .ic{font-size:1.25rem}
.card,.acctbox,.acct,.loan{border-radius:var(--r);box-shadow:var(--sh);margin-bottom:var(--s2)}
.card{padding:var(--pad)}
.card h2{font-size:1.0625rem;font-weight:800;margin:0 0 var(--s2)}
h3{font-size:.8125rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:var(--s4) 0 var(--s1)}
.lbl{font-size:.8125rem;font-weight:600;color:var(--muted);line-height:1.3}
.lbl .muted{font-size:inherit;font-weight:500}
.muted{font-size:.8125rem}
.big{font-size:clamp(1.5rem,1.05rem + 1.9vw,1.875rem);font-weight:800;letter-spacing:-.02em;line-height:1.15}
.hero .big{font-size:clamp(1.75rem,1.2rem + 2.3vw,2.125rem)}
.dcard .big{font-size:clamp(1.375rem,1rem + 1.6vw,1.625rem)}
.mid{font-size:clamp(1.125rem,.95rem + .8vw,1.3125rem);font-weight:800;letter-spacing:-.01em;line-height:1.2}
/* one row model everywhere: [icon] [text] [amount] [chevron] [eye] */
.eyecard{gap:var(--s3)}
.hero{text-align:left;border-left:3px solid var(--rosedeep);padding:var(--s4) var(--pad) var(--s4) calc(var(--pad) - 3px);background:linear-gradient(135deg,#fff 55%,var(--soft))}
.hero .eyecard .grow{text-align:left}
.ico{flex:none;width:var(--ico);height:var(--ico);border-radius:var(--rs);background:var(--soft);color:var(--plum);display:inline-flex;align-items:center;justify-content:center}
.ico svg{width:20px;height:20px}
.ico.in{background:var(--greenbg);color:var(--green)}.ico.out{background:var(--redbg);color:var(--red)}.ico.xfer{background:#EFE7F8;color:var(--xfer)}
.ico.ava{border-radius:50%;background:var(--soft);font-weight:800;font-size:.9375rem;color:var(--plum)}
.hero .ico{background:var(--plum);color:var(--rose)}
.acct{padding:var(--pad);min-height:0;gap:var(--s3);font-size:1rem;font-weight:600}
.acct b{font-size:1.0625rem;font-weight:700}
.acct .amtwrap{gap:var(--s1)}
.acct .chev{width:28px;min-height:40px;font-size:1rem}
.accpanel{padding:0 var(--pad) var(--pad)}
.accpanel .item{padding:var(--s2) 0}
.accpanel .pbtns{gap:var(--s2);margin-top:var(--s2)}
.accpanel .pbtns .btn{min-height:44px;font-size:.875rem;padding:var(--s2) var(--s1)}
.eye{min-width:var(--eye);min-height:var(--eye);width:var(--eye);height:var(--eye);padding:0;border-radius:var(--rs);background:var(--soft);color:var(--plum)}
.eye svg{width:20px;height:20px;pointer-events:none}
.eye{position:relative}.eye::after{content:'';position:absolute;inset:-4px} /* 48 px touch target around the 40 px button */
.eye[aria-pressed=true]{background:var(--soft);color:var(--plum)}
.eye[aria-pressed=false]{background:var(--plum);color:var(--rose)}
header .eye{width:40px;height:40px;background:rgba(255,255,255,.12);color:#fff}
header .eye[aria-pressed=false]{background:var(--rose);color:var(--plum)}
.warn{padding:var(--s3);font-size:.875rem;border-radius:var(--r);margin-bottom:var(--s2);line-height:1.4}
.btn{min-height:48px;padding:var(--s3) var(--s4);font-size:1rem;border-radius:12px;margin-top:var(--s3)}
.row2{gap:var(--s2)}
.row2 .btn{margin-top:var(--s2)}
.btn.sm{min-height:40px;font-size:.8125rem}
label{font-size:.8125rem;margin:var(--s3) 0 var(--s1)}
input,select{font-size:1rem;padding:10px var(--s3);min-height:48px;border-radius:var(--rs)}
.amt{font-size:1.375rem;font-weight:800}
.seg{border-radius:12px}
.seg button{min-height:44px;font-size:.875rem;padding:var(--s2) var(--s1)}
.chips{gap:var(--s2)}
.chip{min-height:44px;padding:var(--s2) var(--s3);font-size:.9375rem;border-width:1.5px;border-radius:var(--rs)}
.item{gap:var(--s3);padding:var(--s3) 0}
.item .body .t{font-size:.9375rem}
.item .amtc{font-size:.9375rem}
.item .acts{gap:var(--s1)}
.item .acts button{min-width:40px;min-height:40px;font-size:1rem;border-radius:var(--rs)}
.modal .sheet{padding:var(--s4) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom));border-radius:20px 20px 0 0}
.modal h2{font-size:1.1875rem;font-weight:800}
.modal .x{min-width:40px;min-height:40px;font-size:1rem}
.badge{font-size:.75rem;padding:3px 10px}
.setacct{padding:var(--s2)}
.setacct .r{grid-template-columns:minmax(0,1fr) minmax(96px,34%) 44px;gap:var(--s2)}
.setacct input{padding:var(--s2) 10px;font-size:.9375rem}
.setacct .iconbtn{min-height:44px}
@media (max-width:380px){.setacct .r{grid-template-columns:minmax(0,1fr) 44px}.setacct .r > div:first-child{grid-column:1/-1}}
.iconbtn{min-height:48px}
.toast{font-size:.875rem;padding:10px var(--s4)}
.empty{padding:var(--s4) var(--s2);font-size:.875rem}
/* loans: outstanding stands out */
.loan{padding:var(--pad);font-size:.9375rem;border-left:0}
.loan.paid{opacity:1;border-left:0}.loan.open{border-left:0}
.loan .top{gap:var(--s3);align-items:center}
.loan .whobox{flex:1;min-width:0;display:flex;flex-direction:column}
.loan .who{font-size:1rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loan .lgiven{font-size:.8125rem}
.lout{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);background:var(--amberbg);border-left:3px solid var(--rosedeep);border-radius:var(--rs);padding:var(--s2) var(--s3);margin-top:var(--s2)}
.lout > span{font-size:.75rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--amber)}
.lout b{font-size:1.1875rem;font-weight:800;color:var(--plum);white-space:nowrap}
.loan .lout{margin-left:calc(var(--ico) + var(--s3))}
.paid .lout,.lout.paid{background:var(--greenbg);border-left-color:var(--green)}
.paid .lout > span,.lout.paid > span,.paid .lout b,.lout.paid b{color:var(--green)}
.loan .nums{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);margin:var(--s2) 0 0 calc(var(--ico) + var(--s3))}
.loan .nums span{font-size:.8125rem;color:var(--muted);white-space:nowrap}
.loan .nums b{font-size:.8125rem;font-weight:700;color:var(--label)}
.lout.detail{padding:var(--s3)}
.lout.detail b{font-size:clamp(1.375rem,1rem + 1.6vw,1.625rem)}
.sumgrid{grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s2)}
.sumgrid div{padding:var(--s2) var(--s3);border-radius:var(--rs)}
.sumgrid small{font-size:.75rem}
.sumgrid b{font-size:.9375rem;font-weight:700}
.th{width:56px;height:56px}
/* v10: kept-separate section + switches */
.sechead{display:flex;align-items:baseline;gap:6px;margin:var(--s5) 0 var(--s2)}

.setcat .cicon{text-align:center;font-size:1.125rem;padding:0 !important}
.setcat .iconbtn{min-height:44px;padding:0}

/* v11 expenses breakdown */
#dExp{cursor:pointer}
#dExp:focus-visible{outline:2px solid var(--rosedeep);outline-offset:2px}

<body>
<header><h1 id="appTitle"><span class="peso">₱</span>Ledger</h1><span id="eyeAllWrap"></span></header>
<main id="app"></main>
<nav>
  <button data-v="home" class="on"><span class="ic">🏠</span>Home</button>
  <button data-v="add"><span class="ic">➕</span>Add</button>
  <button data-v="dash"><span class="ic">📊</span>Dashboard</button>
  <button data-v="loans"><span class="ic">🤝</span>Loans</button>
  <button data-v="set"><span class="ic">⚙️</span>Settings</button>
</nav>
<div class="toast" id="toast"></div>
<button class="updToast" id="updToast" hidden>New version ready · Tap to update</button>
<script>
'use strict';
const APP_V = 12;
const KEY = 'emz-money-v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
// v12: expense categories (money-out only). Stored in the data so Settings can manage them.
const DEFAULT_CATS = [['food', 'Food', '🍜'], ['groceries', 'Groceries', '🛒'], ['bills', 'Bills', '🧾'], ['transport', 'Transport', '🚌'], ['shopping', 'Shopping', '🛍️'], ['family', 'Family', '👪'], ['health', 'Health', '💊'], ['others', 'Others', '📦']];
const defaultCats = () => DEFAULT_CATS.map(([id, name, icon]) => ({ id, name, icon }));
const UNCAT = { id: '', name: 'Uncategorized', icon: '🏷️' };
const catOf = t => (t && t.cat && (S.categories || []).find(c => c.id === t.cat)) || null;
function defaultState() {
  return {
    version: 1,
    accounts: [
      { id: 'main', name: 'BPI Main', type: 'bank', opening: 0 },
      { id: 'timmy', name: 'BPI Timmy', type: 'bank', opening: 0 },
      { id: 'ethan', name: 'BPI Ethan', type: 'bank', opening: 0 },
      { id: 'cash', name: 'Cash on hand', type: 'cash', opening: 0 } // v2: new installs only; existing data is never changed
    ],
    tx: [],          // {id,type:'in'|'out'|'transfer',amount,account,to,date,note,created}
    loans: [],       // {id,borrower,amount,account|null,date,note,created,more:[{id,amount,account|null,date,note,created}]} — account null = not from an account; 'more' = later tranches (v4); old 'due'/'dueDate' kept but ignored
    repayments: [],  // {id,loanId,amount,account|null,date,note,created} — account null = not into an account (v4)
    categories: defaultCats(), // v12: [{id,name,icon}] for money-out entries (tx.cat = id; missing = Uncategorized)
    lastBackup: null
  };
}
function valid(d) { return d && Array.isArray(d.accounts) && Array.isArray(d.tx) && Array.isArray(d.loans) && Array.isArray(d.repayments); }
let S;
let freshStart = false; // true when localStorage had no data on this open (new install or cleared)
// v10: "Include in net worth" flags on accounts and loans. Runs on every load / restore but only fills in a
// flag that is missing, so a value the user has set is never overwritten (old backups get the same defaults).
const SEP_ACCTS = ['bpi timmy', 'bpi ethan']; // accounts kept separate by default
const normName = n => String(n || '').trim().replace(/\s+/g, ' ').toLowerCase();
function migrateData(d) {
  let changed = false;
  for (const a of d.accounts || []) if (typeof a.inNetWorth !== 'boolean') { a.inNetWorth = !SEP_ACCTS.includes(normName(a.name)); changed = true; }
  // loans financed by someone else are saved as "Name (Other person)" → kept separate by default
  for (const l of d.loans || []) if (typeof l.inNetWorth !== 'boolean') { l.inNetWorth = !/\(.+\)/.test(String(l.borrower || '')); changed = true; }
  // v12: data / backups from before categories get the default list; their expenses stay Uncategorized
  if (!Array.isArray(d.categories)) { d.categories = defaultCats(); changed = true; }
  else d.categories = d.categories.filter(c => c && c.id != null && String(c.name || '').trim()).map(c => ({ ...c, id: String(c.id), icon: c.icon || '🏷️' }));
  return changed;
}
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!valid(S)) { S = defaultState(); freshStart = true; migrateData(S); return; } // not written until the first real change, so a recovery offer survives “Not now”
  if (migrateData(S)) localStorage.setItem(KEY, JSON.stringify(S)); // one-time: persist the filled-in flags
}
// Every data change goes through save(): localStorage, then an on-phone snapshot (IndexedDB) and the phone backup file.
function save() { localStorage.setItem(KEY, JSON.stringify(S)); freshStart = false; if (typeof onDataSaved === 'function') onDataSaved(); }
load();
let storagePersisted = null;
// v7: asked after first paint (startup block at the bottom) — only the Settings status uses it.
function askPersist() { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(v => { storagePersisted = v; if (typeof view !== 'undefined' && view === 'set') render(); }).catch(() => {}); }

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cents = n => Math.round((Number(n) || 0) * 100);
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const peso = n => (cents(n) < 0 ? '−₱' : '₱') + (Math.abs(cents(n)) / 100).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const fmtDate = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };
const acct = id => S.accounts.find(a => a.id === id);
const acctName = id => { if (id == null || id === '') return 'No account'; const a = acct(id); return a ? a.name : '(deleted account)'; };
const NONE = '__none'; // chip value for "None" in loan / repayment forms
// A loan's tranches: the original amount first, then any 'Add more' tranches (v4). Old data without 'more' still works.
const tranches = l => [{ id: null, first: true, amount: l.amount, account: l.account == null ? null : l.account, date: l.date, note: l.note, created: l.created, images: l.images }, ...(Array.isArray(l.more) ? l.more : [])];
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400); }
// ---------- hide amounts (same eye pattern as the gold tracker; remembered on this phone) ----------
// Kept in its own key so it never touches the money data or backups. Keys: total, owed, net, a:<accountId>.
const PKEY = 'emz-money-privacy-v1';
let P; try { P = JSON.parse(localStorage.getItem(PKEY)); } catch (e) { P = null; }
if (!P || typeof P.h !== 'object' || !P.h) P = { h: {} };
const savePriv = () => localStorage.setItem(PKEY, JSON.stringify(P));
const MASK = '₱ ••••••';
// v9: simple line icons shown in a fixed 36 px column on every card / row
const SV = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICONS = {
  wallet: SV('<path d="M19 7V5.5A1.5 1.5 0 0 0 17.5 4H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v2.5h-4a2 2 0 0 0 0 4h4V19a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V6"/>'),
  coins: SV('<ellipse cx="12" cy="6" rx="7" ry="2.8"/><path d="M5 6v6c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V6"/><path d="M5 12v6c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8v-6"/>'),
  bank: SV('<path d="M3 9.5 12 4l9 5.5z"/><path d="M5.5 10v7.5M10 10v7.5M14 10v7.5M18.5 10v7.5M3.5 20h17"/>'),
  cash: SV('<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/>'),
  owed: SV('<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 8.5 15.5M8.5 10v5.5H14"/>'),
  lent: SV('<circle cx="12" cy="12" r="9"/><path d="M8.5 15.5 15.5 8.5M10 8.5h5.5V14"/>'),
  receipt: SV('<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>'),
  in: SV('<path d="M17 7 7 17M7 9.5V17h7.5"/>'),
  out: SV('<path d="M7 17 17 7M9.5 7H17v7.5"/>'),
  xfer: SV('<path d="M4 8.5h15l-3.5-3.5M20 15.5H5l3.5 3.5"/>'),
  layers: SV('<path d="m12 3 9 4.5-9 4.5-9-4.5z"/><path d="m3 12 9 4.5 9-4.5M3 16.5 12 21l9-4.5"/>')
};
const ico = (k, cls) => `<span class="ico${cls ? ' ' + cls : ''}">${ICONS[k]}</span>`;
const initial = n => esc((String(n || '?').trim()[0] || '?').toUpperCase());
const EYE_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
const privKeys = () => ['total', ...S.accounts.map(a => 'a:' + a.id), 'owed', 'net', 'sep', 'sepowed', 'd:bank', 'd:lent', 'd:cash', 'd:exp'];
const hid = k => !!P.h[k];
const allHidden = () => privKeys().every(hid);
// An amount: shows ₱ •••••• when its card is hidden (cls = extra classes when shown, e.g. 'neg').
const amt = (n, k, cls) => hid(k) ? `<span class="pv masked">${MASK}</span>` : `<span class="pv ${cls || ''}">${peso(n)}</span>`;
const amtT = (n, k) => hid(k) ? MASK : peso(n); // plain text version (toasts)
const eyeBtn = (k, label) => { const shown = !hid(k);
  return `<button type="button" class="eye" data-eye="${esc(k)}" aria-pressed="${shown}" aria-label="${shown ? 'Hide' : 'Show'} ${esc(label)}" title="${shown ? 'Hide' : 'Show'} ${esc(label)}" onclick="toggleEye(event,'${esc(k)}')">${shown ? EYE_OFF : EYE_OPEN}</button>`; };
function toggleEye(e, k) { if (e) { e.preventDefault(); e.stopPropagation(); } P.h[k] = !hid(k); savePriv(); render(); }
function toggleAll(e) { if (e) { e.preventDefault(); e.stopPropagation(); } const hide = !allHidden(); for (const k of privKeys()) P.h[k] = hide; savePriv(); render(); toast(hide ? 'All amounts hidden' : 'All amounts shown'); }
function drawEyeAll() { const shown = !allHidden(), l = shown ? 'Hide all amounts' : 'Show all amounts';
  $('#eyeAllWrap').innerHTML = `<button type="button" class="eye" id="eyeAll" aria-pressed="${shown}" aria-label="${l}" title="${l}" onclick="toggleAll(event)">${shown ? EYE_OFF : EYE_OPEN}</button>`; }
const byNewest = (a, b) => (b.date || '').localeCompare(a.date || '') || (b.created || 0) - (a.created || 0);
function parseAmt(v) { const n = Number(String(v).replace(/[₱,\s]/g, '')); return isFinite(n) ? r2(n) : NaN; }

// ---------- calculations (in cents to avoid rounding drift) ----------
function balanceC(id) {
  const a = acct(id); let c = a ? cents(a.opening) : 0;
  for (const t of S.tx) {
    if (t.type === 'in' && t.account === id) c += cents(t.amount);
    if (t.type === 'out' && t.account === id) c -= cents(t.amount);
    if (t.type === 'transfer') { if (t.account === id) c -= cents(t.amount); if (t.to === id) c += cents(t.amount); }
  }
  for (const l of S.loans) for (const t of tranches(l)) if (t.account != null && t.account === id) c -= cents(t.amount);
  for (const r of S.repayments) if (r.account != null && r.account === id) c += cents(r.amount);
  return c;
}
const balance = id => balanceC(id) / 100;
const inNW = x => x.inNetWorth !== false; // missing flag = included
const totalBalance = () => S.accounts.filter(inNW).reduce((s, a) => s + balanceC(a.id), 0) / 100; // included accounts only
const sepBalance = () => S.accounts.filter(a => !inNW(a)).reduce((s, a) => s + balanceC(a.id), 0) / 100;
const repaysOf = id => S.repayments.filter(r => r.loanId === id);
function loanInfo(l) {
  const lentC = tranches(l).reduce((x, t) => x + cents(t.amount), 0);
  const repaidC = repaysOf(l.id).reduce((x, r) => x + cents(r.amount), 0);
  const outC = Math.max(0, lentC - repaidC);
  const status = outC === 0 ? 'Paid' : 'Open'; // no overdue tracking
  return { lent: lentC / 100, repaid: repaidC / 100, out: outC / 100, status };
}
function loanTotals(sep) { // default: loans counted in net worth; sep=true: loans kept separate
  let outC = 0, open = 0, n = 0;
  for (const l of S.loans) { if (inNW(l) === !!sep) continue; const i = loanInfo(l); n++; outC += cents(i.out); if (i.status !== 'Paid') open++; }
  return { out: outC / 100, open, n };
}
function daysSinceBackup() { return S.lastBackup ? Math.floor((Date.now() - S.lastBackup) / 86400000) : null; }
const hasData = () => S.tx.length || S.loans.length || S.repayments.length || S.accounts.some(a => cents(a.opening));

// ---------- navigation ----------
let view = 'home';
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.v));
function go(v, opts) {
  view = v; addMode = (opts && opts.mode) || addMode;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === (v === 'exp' ? 'dash' : v)));
  render(); window.scrollTo(0, 0);
}
function render() { renderInner(); fitBig(); }
// Shrink big numbers so long amounts (e.g. ₱12,345,678.90) never run under the eye button.
function fitBig() {
  document.querySelectorAll('#app .hero .big, #app .dcard .big, #modal .big').forEach(el => {
    el.classList.add('fit'); el.style.fontSize = '';
    let f = parseFloat(getComputedStyle(el).fontSize); const sw = el.scrollWidth, cw = el.clientWidth;
    if (sw <= cw + 1) return; // fits: one layout read, no loop
    f = Math.max(20, Math.floor(f * cw / sw)); el.style.fontSize = f + 'px'; // one proportional jump…
    for (let i = 0; i < 4 && f > 20 && el.scrollWidth > el.clientWidth + 1; i++) { f -= 1; el.style.fontSize = f + 'px'; } // …then at most 4 nudges
  });
}
function renderInner() {
  const app = $('#app'); drawEyeAll();
  if (view === 'home') app.innerHTML = homeHTML();
  else if (view === 'add') { app.innerHTML = '<div class="card" id="addCard"></div>'; txForm($('#addCard'), null); }
  else if (view === 'dash') app.innerHTML = dashHTML();
  else if (view === 'exp') app.innerHTML = expHTML();
  else if (view === 'loans') app.innerHTML = loansHTML();
  else if (view === 'set') { app.innerHTML = setHTML(); bindSettings(); }
}

// ---------- home ----------
function homeHTML() {
  const lt = loanTotals(), tb = totalBalance(), ds = daysSinceBackup();
  let h = '';
  if (fileNeedsPerm()) h += `<button class="warn" id="fileBanner" onclick="grantFilePerm()">📁 Tap to keep saving backups to your phone</button>`;
  if (hasData() && (ds === null || ds >= 14))
    h += `<button class="warn" id="backupNag" onclick="go('set')">💾 Auto backups stay on this phone only. ${ds === null ? 'Share a copy off the phone' : `Last copy off the phone was ${ds} days ago — share a new one`} (e.g. Messenger or email). Tap to back up.</button>`;
  // order: Net worth (hero) · Total balance · included accounts · Owed to me · [Kept separate: subtotal · accounts · owed]

  h += `</div><h3>By account</h3><div class="card list" id="expByAcct">`;

  for (const t of list) {
    const a = acct(t.account), cl = catOf(t) || UNCAT;
    h += `<button type="button" class="item exrow" data-tx="${esc(t.id)}" onclick="reopen=null;editTx('${esc(t.id)}')" aria-label="Edit expense">${cl === UNCAT ? ico('out', 'out') : `<span class="ico emo" aria-hidden="true">${esc(cl.icon)}</span>`}<div class="body"><div class="t">${esc(t.note || 'Money out')}</div>
      <div class="muted">${fmtDate(t.date)} · <span class="cl">${esc(cl.name)}</span> · ${esc(acctName(t.account))}${a && !inNW(a) ? ' <span class="septag">separate</span>' : ''}</div></div><div class="amtc minus">${hid(K) ? '' : '−'}${amt(t.amount, K)}</div></button>`;
  }
  return h + '</div>';
}

function lendForm(id) {

// Add more to an existing loan (a new tranche), or edit one of those tranches.
function trancheForm(loanId, tid) {

function delTranche(loanId, tid) {

}

function repayForm(loanId, repId) {

function delRepay(id) {

  await idbDo('images', 'readwrite', st => st.put({ id, blob, w, h, type: 'image/jpeg', created: Date.now() }, id));
  return id;
}
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
function dataURLToBlob(u) { const [h, b64] = u.split(','), type = (h.match(/data:([^;]+)/) || [])[1] || 'image/jpeg', bin = atob(b64), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type }); }
async function putImages(map) {
  const recs = [];
  for (const [id, u] of Object.entries(map)) { try { const blob = dataURLToBlob(u); recs.push({ id, blob, type: blob.type, created: Date.now() }); imgB64.set(id, u); } catch (e) {} }
  for (const r of recs) { const old = imgURLs.get(r.id); if (old) { URL.revokeObjectURL(old); imgURLs.delete(r.id); } }
  if (recs.length) await idbDo('images', 'readwrite', st => { recs.forEach(r => st.put(r, r.id)); });
}
const entryImgs = e => (e && Array.isArray(e.images)) ? e.images : [];
const loanImgIds = l => [...tranches(l).flatMap(entryImgs), ...repaysOf(l.id).flatMap(entryImgs)];
const loanImgCount = l => loanImgIds(l).length;
const allImgIds = d => { const out = []; for (const l of d.loans || []) { out.push(...entryImgs(l)); for (const t of l.more || []) out.push(...entryImgs(t)); } for (const r of d.repayments || []) out.push(...entryImgs(r)); return out; };
// File backups (phone file + Save backup file) carry the photos as base64; Copy/Share text stays data-only.
async function fileBackupText() {
  const images = {};
  for (const id of new Set(allImgIds(S))) {
    if (!imgB64.has(id)) { try { const r = await getImg(id); if (r && r.blob) imgB64.set(id, await blobToDataURL(r.blob)); } catch (e) {} }
    if (imgB64.has(id)) images[id] = imgB64.get(id);
  }
  return JSON.stringify({ app: 'emz-tracker', exported: new Date().toISOString(), data: S, images });
}
// Thumbnails (blurred while the Owed amounts are hidden; the viewer then stays closed)
const photosHidden = () => hid('owed');
function thumbsHTML(ids, ref) {
  if (!ids || !ids.length) return '';
  const b = photosHidden();
  return `<div class="thumbs" data-ref="${esc(ref)}">${ids.map((x, i) => `<button type="button" class="th${b ? ' blur' : ''}" onclick="openViewer('${esc(ref)}',${i})" aria-label="Photo ${i + 1} of ${ids.length}"><img data-img="${esc(x)}" alt=""></button>`).join('')}</div>`;
}
function fillThumbs(root) { root.querySelectorAll('img[data-img]').forEach(el => { if (el.src) return; imgURL(el.dataset.img).then(u => { if (u) el.src = u; else el.closest('.th').classList.add('missing'); }); }); }
function imgFieldHTML() {
  return `<div class="imgfield"><label>Photos / screenshots (optional, up to ${MAX_IMG})</label><div class="thumbs" id="fThumbs"></div>
    <label class="btn light addimg" id="addImgBtn">📷 Add photos<input type="file" id="imgInput" accept="image/*" multiple hidden></label></div>`;
}
function bindImgField(sh, orig) {
  const c = { ids: [...(orig || [])], orig: [...(orig || [])], added: [], busy: 0 };
  const box = sh.querySelector('#fThumbs'), inp = sh.querySelector('#imgInput'), btn = sh.querySelector('#addImgBtn');
  const draw = () => {
    const b = photosHidden();
    box.innerHTML = c.ids.map(id => `<div class="th${b ? ' blur' : ''}"><img data-img="${esc(id)}" alt="Photo"><button type="button" class="thx" data-rm="${esc(id)}" aria-label="Remove photo">✕</button></div>`).join('');
    fillThumbs(box); btn.hidden = c.ids.length >= MAX_IMG; btn.style.display = c.ids.length >= MAX_IMG ? 'none' : '';
    box.querySelectorAll('[data-rm]').forEach(x => x.onclick = () => { c.ids = c.ids.filter(i => i !== x.dataset.rm); draw(); });
  };
  inp.onchange = async () => {
    const files = [...inp.files]; inp.value = ''; const room = MAX_IMG - c.ids.length;
    if (files.length > room) toast(`Up to ${MAX_IMG} photos per entry${room > 0 ? ` — added ${room}` : ''}`);
    for (const f of files.slice(0, Math.max(0, room))) {
      c.busy++;
      try { const id = await storeImage(f); if (formImgs !== c) { delImages([id]); } else { c.ids.push(id); c.added.push(id); draw(); } }
      catch (e) { toast('Couldn’t read that image'); }
      finally { c.busy--; }
    }
  };
  c.commit = () => { delImages([...c.orig, ...c.added].filter(x => !c.ids.includes(x))); if (formImgs === c) formImgs = null; return c.ids.length ? c.ids.slice() : undefined; };
  c.discard = () => { delImages(c.added.filter(x => !c.orig.includes(x))); };
  formImgs = c; draw(); return c;
}
// ref: 'L:<loanId>' (first amount) | 'T:<loanId>:<trancheId>' | 'R:<repaymentId>'
function ownerOf(ref) {
  const [k, a, b] = String(ref).split(':');
  if (k === 'L') return S.loans.find(x => x.id === a) || null;
  if (k === 'T') { const l = S.loans.find(x => x.id === a); return l && Array.isArray(l.more) ? l.more.find(x => x.id === b) || null : null; }
  if (k === 'R') return S.repayments.find(x => x.id === a) || null;
  return null;
}
const loanOfRef = ref => { const [k, a] = String(ref).split(':'); if (k === 'R') { const r = S.repayments.find(x => x.id === a); return r ? r.loanId : null; } return a; };
function closeViewer() { const v = $('#viewer'); if (v) { v.remove(); document.removeEventListener('keydown', viewerKeys); } }
let viewerKeys = () => {};
function openViewer(ref, i) {
  const o = ownerOf(ref); if (!o || !entryImgs(o).length) return;
  if (photosHidden()) { toast('Photos are hidden — tap the 👁 to show amounts and photos'); return; }
  closeViewer();
  const v = document.createElement('div'); v.className = 'viewer'; v.id = 'viewer'; v.setAttribute('role', 'dialog'); v.setAttribute('aria-label', 'Photo viewer');
  v.innerHTML = `<div class="vbar"><b id="vCount"></b><span><button id="vDel" aria-label="Delete photo">🗑️</button><button id="vClose" aria-label="Close">✕</button></span></div>
    <div class="vstage" id="vStage"><img id="vImg" alt="Photo"></div><button class="vnav prev" id="vPrev" aria-label="Previous photo">‹</button><button class="vnav next" id="vNext" aria-label="Next photo">›</button>`;
  document.body.appendChild(v);
  let k = i;
  const show = async () => {
    const ids = entryImgs(o); k = Math.max(0, Math.min(k, ids.length - 1));
    v.querySelector('#vCount').textContent = `${k + 1} / ${ids.length}`; v.querySelector('#vPrev').hidden = k <= 0; v.querySelector('#vNext').hidden = k >= ids.length - 1;
    const id = ids[k], u = await imgURL(id); if (entryImgs(o)[k] === id) { const im = v.querySelector('#vImg'); im.src = u || ''; im.dataset.img = id; }
  };
  const step = d => { const n = entryImgs(o).length; if (k + d >= 0 && k + d < n) { k += d; show(); } };
  v.querySelector('#vPrev').onclick = () => step(-1); v.querySelector('#vNext').onclick = () => step(1);
  v.querySelector('#vClose').onclick = closeViewer;
  const st = v.querySelector('#vStage'); let x0 = null;
  st.addEventListener('pointerdown', e => { x0 = e.clientX; });
  st.addEventListener('pointerup', e => { if (x0 == null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); });
  st.addEventListener('pointercancel', () => { x0 = null; });
  viewerKeys = e => { if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'Escape') closeViewer(); };
  document.addEventListener('keydown', viewerKeys);
  v.querySelector('#vDel').onclick = () => {
    if (!confirm('Delete this photo? This can’t be undone.')) return;
    const id = entryImgs(o)[k]; o.images = entryImgs(o).filter(x => x !== id); if (!o.images.length) delete o.images;
    delImages([id]); save(); render();
    const lid = loanOfRef(ref); if ($('#modal') && lid) openLoan(lid);

    if (!entryImgs(o).length) closeViewer(); else show();

// Tidy up photos nothing points to any more (e.g. app closed mid-form). Photos still referenced by an
// on-phone auto backup are kept, so restoring one of those still shows its photos.
async function gcImages() {
  try {
    const keep = new Set(allImgIds(S)); for (const s of SNAPS) { try { allImgIds(JSON.parse(s.data)).forEach(x => keep.add(x)); } catch (e) {} }
    if (formImgs) formImgs.ids.forEach(x => keep.add(x));
    const keys = await idbDo('images', 'readonly', st => st.getAllKeys()) || [];
    const young = k => { const t = parseInt(String(k).slice(4, -5), 36); return isFinite(t) && Date.now() - t < 3600000; }; // added in the last hour: maybe a form in progress
    const gone = keys.filter(k => !keep.has(k) && !young(k)); if (gone.length) await delImages(gone);
  } catch (e) {}
}

// ---- updates: a new version waits until you tap the toast (never swaps mid-session) ----
let swReg = null, userUpdate = false;
